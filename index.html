//  SEND TO CLAUDE
// ═══════════════════════════════════════
async function sendToClaude() {
  const text = document.getElementById('writeArea').value.trim();
  if (!text) { toast('先写点什么吧'); return; }

  const prompt = currentPrompt || '';
  const btn = document.getElementById('btnSend');
  const origHTML = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> ' + t('spinner_sending');
  btn.disabled = true;

  // ── 如果是继续已有线程，提取历史 ──
  let threadHistory = null;
  if (editingId) {
    const entries = getEntries();
    const entry = entries.find(e => e.id === editingId);
    if (entry && entry.thread && entry.thread.length > 0) {
      threadHistory = entry.thread;  // [{role, text, date}, ...]
    }
  }

  let reply = null;
  let sent = false;

  // Try server first (with AI reply)
  if (apiOnline) {
    try {
      btn.innerHTML = '<span class="spinner"></span> ' + t('spinner_reading');
      const resp = await fetch(`${API_BASE}/api/submit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ text, prompt, history: threadHistory, source: currentQuestion ? (L==='zh' ? currentQuestion.src : (currentQuestion.enSrc || currentQuestion.src)) : null }),
        signal: AbortSignal.timeout(65000),
      });
      const data = await resp.json();
      if (data.ok) {
        sent = true;
        if (data.reply) reply = data.reply;
      }
    } catch(e) {
      if (e.name === 'TimeoutError') { sent = true; }
    }
  }

  if (!sent) {
    copyToClipboard(text, prompt);
    toast(t('toast_copied'));
  }

  // ── 只把「新消息」加入线程，不重复旧内容 ──
  const now = new Date().toISOString();
  const newMsgs = [{ role: 'user', text, date: now }];
  if (reply) {
    newMsgs.push({ role: 'claude', text: reply, date: now });
  }

  const entries = getEntries();
  let cloudEntry = null;
  if (editingId) {
    const idx = entries.findIndex(e => e.id === editingId);
    if (idx >= 0) {
      if (!entries[idx].thread) {
        entries[idx].thread = [
          { role: 'user', text: entries[idx].text, date: entries[idx].date }
        ];
      }
      entries[idx].thread.push(...newMsgs);
      entries[idx].text = text;
      entries[idx].editedAt = now;
      cloudEntry = entries[idx];
    }
  } else {
    const newId = Date.now();
    cloudEntry = { id: newId, text, prompt: prompt || null, date: now, thread: newMsgs };
    entries.unshift(cloudEntry);
    editingId = newId;
  }
  saveEntries(entries);
  if (cloudEntry) cloudSync('upsert', cloudEntry);

  // ── 不清空面板，切换到继续对话模式 ──
  document.getElementById('writeArea').value = '';
  document.getElementById('writeArea').placeholder = t('prompt_continue');
  document.getElementById('writeMeta').innerHTML =
    '<span style="color:var(--accent);">✦ 对话中</span>'
    + ' <span style="font-size:0.7rem;color:rgba(200,200,220,0.35);">继续输入，发送后追加到这颗星辰</span>';
  document.querySelector('#panel-write .btn.primary').textContent = t('saving_update');
  document.getElementById('btnEndConv').style.display = '';
  // 刷新线程预览
  const tp = document.getElementById('threadPreview');
  if (tp && editingId) {
    const e = getEntries().find(en => en.id === editingId);
    if (e && e.thread) {
      tp.style.display = 'block';
      tp.innerHTML = e.thread.map((msg, i) => {
        const isUser = msg.role === 'user';
        const roleColor = isUser ? 'var(--accent)' : 'rgba(140,200,160,0.7)';
        const label = isUser ? '💭 你' : '🌿 Claude';
        const cid = 'tpc-' + i;
        return '<div class="tp-msg">'
          + '<div class="tp-role" style="color:' + roleColor + '">' + label + '</div>'
          + '<div class="tp-content" id="' + cid + '" style="max-height:4.5em;overflow:hidden;">' + escapeHtml(msg.text) + '</div>'
          + '<a href="#" class="tp-expand" onclick="toggleTPMsg(\'' + cid + '\',this);return false;" style="font-size:0.65rem;color:var(--accent);">展开</a>'
          + '</div>';
      }).join('');
    }
  }
  initStars();

  if (reply) {
    toast(t('toast_claude_replied'));
  } else if (sent) {
    toast(t('toast_claude_wait'));
  } else {
    toast(t('toast_claude_saved'));
  }

  btn.innerHTML = origHTML;
  btn.disabled = false;
}

async function sendThreadMessage(id) {
  const input = document.getElementById('threadInput');
  if (!input) return;
  const newMsg = input.value.trim();
  if (!newMsg) { toast('写点什么吧'); return; }

  const entries = getEntries();
  const idx = entries.findIndex(e => e.id === id);
  if (idx < 0) return;
  const entry = entries[idx];
  if (!entry.thread) {
    entry.thread = [{ role: 'user', text: entry.text, date: entry.date }];
  }

  // 把新消息加入线程
  const now = new Date().toISOString();
  entry.thread.push({ role: 'user', text: newMsg, date: now });
  entry.text = newMsg;
  entry.editedAt = now;

  // 构建结构化对话历史发给服务器
  let reply = null;
  if (apiOnline) {
    try {
      const history = entry.thread.slice(0, -1); // 不包含刚加入的新消息
      const resp = await fetch(`${API_BASE}/api/submit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({
          text: newMsg,
          prompt: entry.prompt || '',
          history: history,
          source: null
        }),
        signal: AbortSignal.timeout(65000),
      });
      const data = await resp.json();
      if (data.ok && data.reply) reply = data.reply;
    } catch(e) {}
  }

  if (reply) {
    entry.thread.push({ role: 'claude', text: reply, date: new Date().toISOString() });
  }

  saveEntries(entries);
  cloudSync('upsert', entry);
  openEntry(id);

  if (reply) {
    toast('🌿 Claude 已回复');
  } else {
    toast('已发送 · 等待回复');
  }
}

function copyToClipboard(text, prompt) {
  let msg = '';
  if (prompt) {
    msg += '我在「思·在」回应了这个问题：\n';
    msg += '> ' + prompt + '\n\n';
  }
  msg += text;
  msg += '\n\n———\n（来自 思·在 哲学思辨花园）';

  navigator.clipboard.writeText(msg).catch(() => {
    // Fallback: select from a temporary textarea
    const ta = document.createElement('textarea');
    ta.value = msg;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').style.display = 'none';
}

  document.body.appendChild(el);

}

// ═══════════════════════════════════════
//  SYNC — GitHub Gist 云同步
// ═══════════════════════════════════════
let syncGistId = localStorage.getItem('sizai_gist_id') || null;
let syncToken = localStorage.getItem('sizai_gh_token') || '';
let syncInProgress = false;

function ghHeaders() {
  return syncToken ? { 'Authorization': 'Bearer ' + syncToken, 'Accept': 'application/vnd.github.v3+json' } : {};
}

async function syncFindOrCreateGist() {
  if (!syncToken) return null;
  if (syncGistId) {
    try {
      const r = await fetch('https://api.github.com/gists/' + syncGistId, { headers: ghHeaders() });
      if (r.ok) return syncGistId;
    } catch(e) {}
  }
  try {
    const r = await fetch('https://api.github.com/gists?per_page=100', { headers: ghHeaders() });
    const gists = await r.json();
    if (Array.isArray(gists)) {
      const found = gists.find(g => g.description && g.description.includes('sizai-data'));
      if (found) { syncGistId = found.id; localStorage.setItem('sizai_gist_id', syncGistId); return syncGistId; }
    }
  } catch(e) {}
  try {
    const r = await fetch('https://api.github.com/gists', {
      method: 'POST', headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: 'sizai-data', public: false, files: { 'sizai-entries.json': { content: '[]' } } })
    });
    const data = await r.json();
    if (data.id) { syncGistId = data.id; localStorage.setItem('sizai_gist_id', syncGistId); return syncGistId; }
  } catch(e) {}
  return null;
}

async function syncUpload() {
  if (!syncToken || syncInProgress) return;
  const gistId = await syncFindOrCreateGist();
  if (!gistId) return;
  syncInProgress = true;
  try {
    const entries = getEntries();
    await fetch('https://api.github.com/gists/' + gistId, {
      method: 'PATCH', headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: { 'sizai-entries.json': { content: JSON.stringify(entries, null, 2) } } })
    });
    document.getElementById('syncBtn').className = 'sync-btn synced';
  } catch(e) {
    document.getElementById('syncBtn').className = 'sync-btn';
  }
  syncInProgress = false;
}

async function syncDownload() {
  if (!syncToken) return false;
  const gistId = await syncFindOrCreateGist();
  if (!gistId) return false;
  try {
    const r = await fetch('https://api.github.com/gists/' + gistId, { headers: ghHeaders() });
    const gist = await r.json();
    const file = gist.files && gist.files['sizai-entries.json'];
    if (file && file.content) {
      const remote = JSON.parse(file.content);
      if (!Array.isArray(remote)) return false;
      const merged = syncMerge(getEntries(), remote);
      localStorage.setItem('sizai_entries', JSON.stringify(merged));
      document.getElementById('syncBtn').className = 'sync-btn synced';
      return true;
    }
  } catch(e) {}
  return false;
}

function syncMerge(local, remote) {
  const map = new Map();
  remote.forEach(e => map.set(e.id, e));
  local.forEach(e => {
    const existing = map.get(e.id);
    if (!existing || (e.editedAt || e.date) >= (existing.editedAt || existing.date)) {
      map.set(e.id, e);
    }
  });
  return Array.from(map.values()).sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());
}

let syncTimer = null;
function syncAutoSave() {
  if (!syncToken) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncUpload(), 2000);
}

  if (!syncToken) { openSettings(); return; }

    + '<button class="btn primary" onclick="saveToken()">' + (isZh?'保存':'Save') + '</button>'
    + '<button class="btn" onclick="syncNow()">' + (isZh?'立即同步':'Sync Now') + '</button>'
    + '<button class="close-btn" onclick="closeSettings()" style="margin-left:auto;">' + (isZh?'关闭':'Close') + '</button>'
    + '</div>';
  document.getElementById('settingsOverlay').style.display = 'flex';
}

function saveToken() {
  const input = document.getElementById('tokenInput');
  const val = input.value.trim();
  if (val && !val.startsWith('…')) {
    syncToken = val;
    localStorage.setItem('sizai_gh_token', syncToken);
    syncGistId = null;
    localStorage.removeItem('sizai_gist_id');
    toast(L==='zh'?'Token 已保存':'Token saved');
  }
  closeSettings();
}

function exportData() {
  const data = {
    entries: getEntries(),
    exportedAt: new Date().toISOString(),
  };
  const text = JSON.stringify(data, null, 2);
  navigator.clipboard.writeText(text).then(() => {
    toast(L==='zh'?'已复制到剪贴板 · 粘贴到备忘录或任何地方保存':'Copied · Paste into Notes or anywhere to save');
  }).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast(L==='zh'?'已复制到剪贴板':'Copied to clipboard');
  });
  closeSettings();
}

function importData() {
  const isZh = L === 'zh';
  const code = prompt(
    isZh ? '请粘贴之前导出的备份数据：' : 'Paste the backup data here:'
  );
  if (!code || !code.trim()) return;
  try {
    const data = JSON.parse(code.trim());
    if (!data.entries || !Array.isArray(data.entries)) throw new Error('Invalid');
    const merged = syncMerge(getEntries(), data.entries);
    localStorage.setItem('sizai_entries', JSON.stringify(merged));
    renderGarden();
    initStars();
    syncAutoSave();
    toast((isZh?'已恢复 ':'Restored ') + merged.length + (isZh?' 条记录':' entries'));
  } catch(e) {
    toast(isZh?'格式不对，请确认复制了完整内容':'Wrong format. Make sure you copied the full content.');
  }
}

function closeSettings(e) {
  if (e && e.target !== document.getElementById('settingsOverlay')) return;
  document.getElementById('settingsOverlay').style.display = 'none';
}

displayQuestion();

updateCharCount();
checkAPIStatus();

document.getElementById('writeArea').addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {

    saveEntry();

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('modalOverlay').style.display = 'none';

});
