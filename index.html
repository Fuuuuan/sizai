<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>思·在 — 哲学思辨花园</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: rgba(20,20,40,0.7);
    --text: #c8c8d4;
    --text-bright: #e8e8f0;
    --accent: #d4a854;
    --accent-dim: rgba(212,168,84,0.15);
    --accent-glow: rgba(212,168,84,0.3);
    --border: rgba(255,255,255,0.06);
    --radius: 16px;
    --font-cn: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "KaiTi", "STSong", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.7;
  }

  #starfield {
    position: fixed; top:0; left:0; width:100%; height:100%;
    z-index: 0; pointer-events: none;
  }

  #app {
    position: relative; z-index: 1;
    max-width: 720px; margin: 0 auto;
    padding: 32px 20px 80px;
  }

  header {
    position: relative;
    text-align: center; padding: 48px 0 32px;
  }
  header h1 {
    font-family: var(--font-cn);
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 700;
    color: var(--text-bright);
    letter-spacing: 0.08em;
    background: linear-gradient(135deg, #e8e8f0 0%, #d4a854 60%, #c8a048 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header .subtitle {
    margin-top: 8px;
    font-size: 0.9rem;
    color: rgba(200,200,220,0.5);
    letter-spacing: 0.15em;
    font-family: var(--font-cn);
  }
  .api-status {
    display: inline-block;
    margin-top: 10px;
    font-size: 0.7rem;
    padding: 4px 12px;
    border-radius: 12px;
    letter-spacing: 0.06em;
  }
  .api-status.online {
    background: rgba(100,200,120,0.12);
    color: rgba(140,220,160,0.8);
  }
  .api-status.offline {
    background: rgba(200,200,200,0.06);
    color: rgba(200,200,220,0.35);
  }
  .lang-toggle {
    position: absolute; top: 16px; right: 20px;
    z-index: 10;
  }
  .lang-toggle button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(200,200,220,0.4);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.7rem; cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.2s;
  }
  .lang-toggle button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .lang-toggle button.active-lang {
    background: var(--accent-dim);
    border-color: rgba(212,168,84,0.3);
    color: var(--accent);
  }
  .auth-btn {
    position: absolute; top: 16px; left: 20px;
    z-index: 10;
    background: rgba(212,168,84,0.06);
    border: 1px solid rgba(212,168,84,0.2);
    color: var(--accent);
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 0.7rem; cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.3s;
    animation: authPulse 3s ease-in-out infinite;
  }
  @keyframes authPulse {
    0%, 100% { box-shadow: 0 0 0 rgba(212,168,84,0); }
    50% { box-shadow: 0 0 8px rgba(212,168,84,0.15); }
  }
  .auth-btn:hover { border-color: var(--accent); animation: none; }
  .auth-btn.logged-in {
    background: rgba(140,200,160,0.06);
    border-color: rgba(140,200,160,0.2);
    color: rgba(140,200,160,0.7);
    animation: none;
  }
  .sync-btn {
    position: absolute; top: 16px; left: 20px;
    z-index: 10;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(200,200,220,0.4);
    padding: 4px 8px;
    border-radius: 12px;
    font-size: 0.7rem; cursor: pointer;
    transition: all 0.2s;
  }
  .sync-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sync-btn.synced { color: rgba(140,200,160,0.6); border-color: rgba(140,200,160,0.2); }

  nav {
    display: flex; justify-content: center; gap: 4px;
    margin-bottom: 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 40px; padding: 4px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  nav button {
    flex: 1; padding: 10px 16px;
    border: none; border-radius: 36px;
    background: transparent;
    color: rgba(200,200,220,0.55);
    font-size: 0.85rem; cursor: pointer;
    transition: all 0.3s ease;
    font-family: var(--font-cn);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  nav button.active {
    background: var(--accent-dim);
    color: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
  }
  nav button:hover:not(.active) {
    color: rgba(200,200,220,0.8);
  }

  .panel {
    display: none;
    animation: fadeUp 0.5s ease;
  }
  .panel.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    margin-bottom: 20px;
  }

  .question-block {
    text-align: center; padding: 40px 20px;
  }
  .question-label {
    font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-bottom: 20px;
    font-family: var(--font-sans);
  }
  .question-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 0.65rem;
    margin-left: 8px;
    letter-spacing: 0.06em;
    background: var(--accent-dim);
    color: var(--accent);
    vertical-align: middle;
  }
  .question-text {
    font-family: var(--font-cn);
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    color: var(--text-bright);
    line-height: 1.8;
    margin-bottom: 8px;
    transition: opacity 0.4s ease;
  }
  .question-source {
    font-size: 0.8rem;
    color: rgba(200,200,220,0.35);
    margin-top: 16px;
  }
  .question-actions {
    display: flex; gap: 12px; justify-content: center;
    margin-top: 28px; flex-wrap: wrap;
  }
  .btn {
    padding: 10px 24px;
    border-radius: 24px; border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.25s ease;
    font-family: var(--font-cn);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 24px var(--accent-glow);
  }
  .btn.primary {
    background: var(--accent-dim);
    border-color: rgba(212,168,84,0.3);
    color: var(--accent);
  }
  .btn.primary:hover {
    background: rgba(212,168,84,0.25);
  }
  .btn:disabled {
    opacity: 0.4; cursor: not-allowed; pointer-events: none;
  }

  .write-area {
    width: 100%; min-height: 260px;
    background: rgba(10,10,20,0.5);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    color: var(--text);
    font-family: var(--font-cn);
    font-size: 1rem;
    line-height: 1.9;
    resize: vertical;
    outline: none;
    transition: border-color 0.3s;
  }
  .write-area:focus {
    border-color: rgba(212,168,84,0.4);
    box-shadow: 0 0 30px rgba(212,168,84,0.08);
  }
  .write-area::placeholder {
    color: rgba(200,200,220,0.2);
  }
  .thread-preview {
    max-height: 220px; overflow-y: auto;
    margin-bottom: 14px;
    padding: 14px 16px;
    background: rgba(10,10,20,0.4);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 0.82rem; line-height: 1.7;
  }
  .thread-preview .tp-msg {
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .thread-preview .tp-msg:last-child {
    margin-bottom: 0; padding-bottom: 0; border-bottom: none;
  }
  .thread-preview .tp-role {
    font-size: 0.62rem;
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }
  .write-meta {
    display: flex; gap: 12px; align-items: center;
    margin-top: 12px; flex-wrap: wrap;
    font-size: 0.8rem; color: rgba(200,200,220,0.4);
  }
  .write-meta .prompt-ref {
    color: var(--accent);
    font-style: italic;
  }
  .char-count { margin-left: auto; }

  /* ── Garden / Card List ── */
  .search-box {
    position: relative;
    margin-bottom: 14px;
  }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 10px 40px 10px 16px;
    color: var(--text);
    font-size: 0.85rem;
    font-family: var(--font-sans);
    outline: none;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: border-color 0.3s;
  }
  .search-input:focus {
    border-color: rgba(212,168,84,0.4);
    box-shadow: 0 0 20px rgba(212,168,84,0.06);
  }
  .search-input::placeholder {
    color: rgba(200,200,220,0.25);
  }
  .search-clear {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: rgba(200,200,220,0.4);
    font-size: 0.8rem;
    padding: 4px;
  }
  .search-clear:hover { color: var(--accent); }
  .btn-end { display: none; border-color: rgba(200,180,140,0.2); font-size: 0.8rem; }
  .btn-end:hover { border-color: rgba(200,140,100,0.4); color: rgba(200,160,100,0.8); }
  .search-result {
    font-size: 0.7rem;
    color: rgba(200,200,220,0.35);
    margin-bottom: 10px;
    text-align: center;
  }
  .garden-list {
    display: flex; flex-direction: column; gap: 10px;
  }
  .garden-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    transition: all 0.25s ease;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .garden-card:hover {
    border-color: rgba(212,168,84,0.3);
    box-shadow: 0 0 20px rgba(212,168,84,0.06);
  }
  .garden-card .gc-date {
    font-size: 0.7rem;
    color: rgba(200,200,220,0.35);
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .garden-card .gc-prompt {
    font-size: 0.82rem;
    color: var(--accent);
    font-style: italic;
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .garden-card .gc-preview {
    font-size: 0.88rem;
    color: var(--text);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .garden-card .gc-meta {
    display: flex; gap: 12px; align-items: center;
    margin-top: 10px;
    font-size: 0.7rem;
    color: rgba(200,200,220,0.3);
  }
  .garden-card .gc-share {
    font-size: 0.7rem;
    color: rgba(180,200,220,0.35);
    cursor: pointer;
    text-decoration: none;
    transition: color 0.2s;
  }
  .garden-card .gc-share:hover { color: var(--accent); }
  .garden-card .gc-delete {
    font-size: 0.7rem;
    color: rgba(200,200,220,0.2);
    cursor: pointer;
    text-decoration: none;
    transition: color 0.2s;
  }
  .garden-card .gc-delete:hover {
    color: #e06060;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: rgba(200,200,220,0.25);
    font-family: var(--font-cn);
    font-size: 1rem;
    line-height: 2;
  }

  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: rgba(30,30,50,0.9);
    border: 1px solid var(--border);
    color: var(--text-bright);
    padding: 10px 24px;
    border-radius: 24px;
    font-size: 0.85rem;
    z-index: 100;
    animation: toastIn 0.3s ease, toastOut 0.3s ease 1.8s forwards;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    pointer-events: none;
  }
  @keyframes toastIn  { from { opacity:0; transform:translateX(-50%) translateY(10px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
  @keyframes toastOut { from { opacity:1; } to { opacity:0; } }

  .modal-overlay {
    position: fixed; inset:0; z-index:50;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: fadeInMod 0.2s ease;
  }
  @keyframes fadeInMod { from{opacity:0} to{opacity:1} }
  .modal {
    background: #141422;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    max-width: 600px; width: 90vw; max-height: 80vh;
    overflow-y: auto;
    font-family: var(--font-cn);
    line-height: 1.8;
    color: var(--text);
  }
  .modal .m-date { font-size:0.75rem; color:rgba(200,200,220,0.3); }
  .modal .m-body { margin-top:16px; white-space: pre-wrap; }
  .modal .close-btn {
    margin-top:20px;
    padding:8px 20px;
    border-radius:20px; border:1px solid var(--border);
    background:transparent; color:var(--text); cursor:pointer;
    font-family:var(--font-cn);
  }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(212,168,84,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 500px) {
    #app { padding: 16px 12px 60px; }
    .card { padding: 20px 16px; }
    nav button { font-size: 0.75rem; padding: 8px 10px; }
  }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="思在">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' rx='36' fill='%230a0a0f'/><text x='90' y='115' text-anchor='middle' font-size='100' font-family='serif'>🌿</text></svg>">
</head>
<body>

<canvas id="starfield"></canvas>

<div id="app">
  <header>
    <button class="auth-btn" id="authBtn" onclick="openAuth()">登录</button>
    <div class="lang-toggle" id="langToggle">
      <button onclick="switchLang('zh')" id="btnZh">中</button>
      <button onclick="switchLang('en')" id="btnEn">EN</button>
    </div>
    <h1 id="appTitle">思·在</h1>
    <div class="subtitle" id="appSubtitle">THINKING · BEING</div>
    <div class="api-status offline" id="apiStatus">本地题库</div>
  </header>

  <nav>
    <button data-panel="question" class="active">🜁 每日一问</button>
    <button data-panel="write">✎ 书写</button>
    <button data-panel="garden">✦ 思之星辰</button>
  </nav>

  <!-- QUESTION PANEL -->
  <section class="panel active" id="panel-question">
    <div class="card question-block">
      <div class="question-label" id="questionLabel">今日之问</div>
      <div class="question-text" id="questionText"></div>
      <div class="question-source" id="questionSource"></div>
      <div class="question-actions">
        <button class="btn" id="btnRefresh" onclick="refreshQuestion()">↻ 换一个问题</button>
        <button class="btn" id="btnAI" onclick="fetchAIQuestion()" style="position:relative;">
          ✦ AI 生成
        </button>
        <button class="btn primary" onclick="goWriteWithQuestion()">✎ 回应这个问题</button>
      </div>
    </div>
  </section>

  <!-- WRITE PANEL -->
  <section class="panel" id="panel-write">
    <div class="card">
      <div class="write-meta" id="writeMeta" style="margin-top:0; margin-bottom:12px;"></div>
      <div class="thread-preview" id="threadPreview" style="display:none;"></div>
      <textarea class="write-area" id="writeArea"
        placeholder="此刻，你在想什么？…"
      ></textarea>
      <div class="write-meta">
        <span class="prompt-ref" id="promptRef"></span>
        <span class="char-count" id="charCount">0 字</span>
      </div>
      <div style="margin-top:16px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
        <button class="btn primary" onclick="saveEntry()">✦ 保存为星辰</button>
        <button class="btn" onclick="sendToClaude()" id="btnSend" style="border-color:rgba(180,200,220,0.3);">↗ 与 Claude 思辨</button>
        <button class="btn" onclick="clearWrite()" id="btnClear">清空</button>
        <button class="btn" onclick="endConversation()" id="btnEndConv" style="display:none; border-color:rgba(200,180,140,0.2);">结束此段</button>
      </div>
    </div>
  </section>

  <!-- GARDEN PANEL — Constellation -->
  <section class="panel" id="panel-garden">
    <div class="search-box" id="searchBox">
      <input type="text" id="searchInput" class="search-input"
        placeholder="搜索星辰…" oninput="filterGarden()">
      <span class="search-clear" id="searchClear" onclick="clearSearch()" style="display:none;">✕</span>
    </div>
    <div class="search-result" id="searchResult" style="display:none;"></div>
    <div class="garden-list" id="gardenList"></div>
    <div class="empty-state" id="gardenEmpty">
      还没有文字。<br>去「书写」那里留下你的第一个想法吧。
    </div>
  </section>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settingsOverlay" style="display:none;" onclick="closeSettings(event)">
    <div class="modal" id="settingsContent"></div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal(event)">
    <div class="modal" id="modalContent"></div>
  </div>

</div>

<script>
// ═══════════════════════════════════════
//  AUTO UPDATE — 检测新版本，自动刷新
// ═══════════════════════════════════════
const APP_VERSION = '18';
if (localStorage.getItem('sizai_version') !== APP_VERSION) {
  localStorage.setItem('sizai_version', APP_VERSION);
  location.reload(true);
}

// ═══════════════════════════════════════
//  ACCOUNT — 自建认证 + 云端数据同步
// ═══════════════════════════════════════
let authUser = null;
let authToken = localStorage.getItem('sizai_auth_token') || null;
let authEmail = localStorage.getItem('sizai_auth_email') || '';

function dbHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (authToken) h['X-Sizai-Token'] = authToken;
  return h;
}

async function checkAuth() {
  if (!authToken || !authEmail) { updateAuthUI(false); return; }
  // 有 token 就先显示登录状态，不等到服务器确认
  authUser = { email: authEmail };
  updateAuthUI(true);
  try {
    const r = await fetch(API_BASE + '/api/entries', {
      headers: dbHeaders(),
      signal: AbortSignal.timeout(50000),  // 冷启动可能 >30s
    });
    if (r.ok) {
      const remote = await r.json();
      if (remote.length > 0) {
        // 合并：云端数据 + 本地未同步的
        const local = getEntries();
        const map = new Map();
        remote.forEach(e => {
          map.set(e.id, {
            id: e.id, text: e.text, prompt: e.prompt,
            date: e.date, editedAt: e.edited_at,
            thread: e.thread || [],
          });
        });
        local.forEach(e => { if (!map.has(e.id)) map.set(e.id, e); });
        const merged = Array.from(map.values()).sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());
        saveEntries(merged);
        renderGarden(); initStars(); refreshUI();
      } else {
        // 云端为空但有本地数据 → 上传本地
        await migrateLocalToCloud();
      }
    } else if (r.status === 401) {
      // 只有 token 真的过期才清除
      authToken = null; authUser = null; authEmail = '';
      localStorage.removeItem('sizai_auth_token');
      localStorage.removeItem('sizai_auth_email');
      updateAuthUI(false);
      return;
    }
    // 其他错误（网络、超时）→ 保持登录状态，用本地数据
  } catch(e) {
    // 网络不通 → 保持登录状态，用本地数据，标记待同步
    console.log('Sync deferred:', e.message);
  }
}

// ── 数据层：Supabase REST API（登录时）或 localStorage（未登录）──

function getEntries() {
  try { return JSON.parse(localStorage.getItem('sizai_entries')) || []; }
  catch(e) { return []; }
}

function saveEntries(entries) {
  localStorage.setItem('sizai_entries', JSON.stringify(entries));
}

async function cloudSync(action, arg) {
  if (!authToken) return;
  try {
    if (action === 'upsert') {
      const e = arg;
      await fetch(API_BASE + '/api/entries', {
        method: 'POST', headers: dbHeaders(),
        body: JSON.stringify(e),
      });
    } else if (action === 'delete') {
      await fetch(API_BASE + '/api/entries/delete', {
        method: 'POST', headers: dbHeaders(),
        body: JSON.stringify({ id: arg }),
      });
    }
  } catch(e) {}
}

async function loadFromCloud() {
  if (!authToken) return false;
  try {
    const r = await fetch(API_BASE + '/api/entries', { headers: dbHeaders() });
    if (r.ok) {
      const remote = await r.json();
      const remoteEntries = remote.map(e => ({
        id: e.id, text: e.text, prompt: e.prompt,
        date: e.date, editedAt: e.edited_at,
        thread: e.thread || [],
      }));
      // 合并：云端优先，本地未上传的保留
      const local = getEntries();
      const map = new Map();
      remoteEntries.forEach(e => map.set(e.id, e));
      local.forEach(e => { if (!map.has(e.id)) map.set(e.id, e); });
      const merged = Array.from(map.values()).sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());
      saveEntries(merged);
      return true;
    }
  } catch(e) {}
  return false;
}

async function migrateLocalToCloud() {
  if (!authToken) return;
  const local = getEntries();
  if (local.length === 0) return;
  let uploaded = 0;
  for (const e of local) {
    try {
      await cloudSync('upsert', e);
      uploaded++;
    } catch(x) {}
  }
  if (uploaded > 0) console.log('Uploaded ' + uploaded + ' entries to cloud');
}

function doLogout() {
  closeModal();
  authToken = null; authUser = null; authEmail = '';
  localStorage.removeItem('sizai_auth_token');
  localStorage.removeItem('sizai_auth_email');
  updateAuthUI(false);

  toast(L==='zh'?'已退出':'Signed out');

async function forceSyncNow() {
  if (!authToken) { toast(L==='zh'?'请先登录':'Please log in first'); return; }

  toast(L==='zh'?'同步完成':'Synced');
}

async function doAuth() {
  const isZh = L === 'zh';
  const emailEl = document.getElementById('authEmail');
  const passwordEl = document.getElementById('authPassword');
  if (!emailEl || !passwordEl) { toast('UI error'); return; }
  const email = emailEl.value.trim();
  const password = passwordEl.value;
  if (!email || !password) { toast(isZh?'请填写邮箱和密码':'Fill in both fields'); return; }
  if (password.length < 6) { toast(isZh?'密码至少6位':'Password must be 6+ chars'); return; }

  try {
    // 先登录
    let r = await fetch(API_BASE + '/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      if (err.error === 'invalid_credentials') {
        // 登录失败 → 尝试注册
        r = await fetch(API_BASE + '/api/auth/signup', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        if (!r.ok) {
          const e2 = await r.json().catch(() => ({}));
          if (e2.error === 'email_exists') {
            toast(isZh?'该邮箱已注册，密码错误':'Email exists, wrong password');
          } else {
            toast(e2.error || (isZh?'注册失败':'Signup failed'));
          }
          return;
        }
        // 注册即登录
        const signupData = await r.json();
        authToken = signupData.token;
        authEmail = email;
      } else {
        toast(err.error || (isZh?'登录失败':'Login failed'));
        return;
      }
    } else {
      const loginData = await r.json();
      authToken = loginData.token;
      authEmail = email;
    }

    if (authToken) {
      authUser = { email: authEmail };
      localStorage.setItem('sizai_auth_token', authToken);
      localStorage.setItem('sizai_auth_email', authEmail);
      closeModal();
      await migrateLocalToCloud();
      await loadFromCloud();
      updateAuthUI(true);
      renderGarden();
      initStars();
      refreshUI();
      toast(isZh?'已登录 ✓':'Logged in ✓');
    }
  } catch(e) {
    toast((isZh?'网络错误：':'Network error: ') + (e.message || e));
  }
}

const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
let w, h;

function resizeCanvas() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); initStars(); });

function initStars() {
  const count = Math.floor((w * h) / 3000);
  stars = [];
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.2 + 0.3,
      a: Math.random(),
      speed: Math.random() * 0.008 + 0.003,
      phase: Math.random() * Math.PI * 2
    });
  }
  const entries = getEntries();
  entries.forEach((entry, i) => {
    const angle = (i / Math.max(entries.length, 1)) * Math.PI * 2;
    const radius = Math.min(w, h) * 0.25;
    stars.push({
      x: w/2 + Math.cos(angle) * radius * (0.4 + Math.random() * 0.6),
      y: h/2 + Math.sin(angle) * radius * (0.4 + Math.random() * 0.6),
      r: 1.5 + Math.random() * 1.5,
      a: 0.7 + Math.random() * 0.3,
      speed: 0.015 + Math.random() * 0.02,
      phase: Math.random() * Math.PI * 2,
      isEntry: true
    });
  });
}

function drawStars() {
  ctx.clearRect(0, 0, w, h);
  const t = Date.now() / 1000;
  for (const s of stars) {
    const alpha = s.a * (0.5 + 0.5 * Math.sin(t * s.speed * 3 + s.phase));
    if (s.isEntry) {
      ctx.fillStyle = `rgba(212,168,84,${alpha * 0.8})`;
      ctx.shadowColor = `rgba(212,168,84,${alpha * 0.5})`;
      ctx.shadowBlur = 6;
    } else {
      ctx.fillStyle = `rgba(200,210,240,${alpha})`;
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
    }
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  requestAnimationFrame(drawStars);
}

initStars();
drawStars();

  { q: "此刻正在读这句话的「你」，和昨天那个「你」，是同一个存在吗？", en: "Is the 'you' reading this sentence right now the same being as the 'you' from yesterday?", src: "—— 时间中的自我同一性", enSrc: "— Self-identity across time" },
  { q: "如果一个人的记忆被完全抹去，他是否变成了另一个人？", en: "If a person's memory were completely erased, would they become someone else?", src: "—— 洛克论人格同一性", enSrc: "— Locke on personal identity" },
  { q: "你觉得自己最「像自己」的时刻是什么时候？", en: "When do you feel most like 'yourself'?", src: "—— 本真性的现象学", enSrc: "— Phenomenology of authenticity" },

  // ── 自由与选择 / Freedom & Choice ──
  { q: "自由意志真的存在吗？如果你的每一个决定都可以被先前的因果链条解释——那「选择」意味着什么？", en: "Does free will actually exist? If every decision you make can be explained by a prior causal chain — what does 'choice' even mean?", src: "—— 决定论 vs 自由意志", enSrc: "— Determinism vs. free will" },
  { q: "什么是真正的自由？是不受约束，还是能够按照自己的意志去选择——即使那个意志本身是被塑造的？", en: "What is true freedom? Freedom from constraints, or the ability to choose according to your own will — even if that will itself was shaped by forces beyond you?", src: "—— 积极自由与消极自由", enSrc: "— Positive & negative freedom" },
  { q: "选择越多就越自由吗？还是选择本身变成了一种负担？", en: "Does more choice mean more freedom? Or does choice itself become a burden?", src: "—— 选择悖论与存在主义", enSrc: "— Paradox of choice & existentialism" },
  { q: "当你「不选择」的时候，你其实已经做了一个选择——这个说法对吗？", en: "When you 'don't choose,' have you actually already made a choice? Is that argument valid?", src: "—— 萨特：「人被判定为自由」", enSrc: "— Sartre: 'Man is condemned to be free'" },
  { q: "如果有一个机器能让你体验任何你想要的人生——你会按那个按钮吗？", en: "If there were a machine that could let you experience any life you wanted — would you press the button?", src: "—— 诺齐克的体验机器", enSrc: "— Nozick's experience machine" },
  { q: "你觉得你的生活中有多少是真正由你决定的？10%？50%？还是 0%？", en: "How much of your life do you think is genuinely decided by you? 10%? 50%? Or 0%?", src: "—— 宿命论与能动性", enSrc: "— Fatalism & agency" },
  { q: "后悔意味着什么？它是否暗示着我们在那个时刻原本「可以」做出不同的选择？", en: "What does regret mean? Does it imply that we actually could have made a different choice in that moment?", src: "—— 自由意志与道德责任", enSrc: "— Free will & moral responsibility" },
  { q: "如果科学证明自由意志是一种幻觉，你还会为自己的选择感到骄傲或羞愧吗？", en: "If science proved free will is an illusion, would you still feel pride or shame about your choices?", src: "—— 神经决定论的伦理后果", enSrc: "— Ethical consequences of neuro-determinism" },
  { q: "你愿意放弃多少自由来换取安全感和确定性？", en: "How much freedom would you trade for security and certainty?", src: "—— 自由与安全的辩证", enSrc: "— Freedom vs. security dialectic" },

  // ── 虚无、荒谬与意义 / Nothingness, Absurdity & Meaning ──
  { q: "虚无是什么颜色？不是黑色——黑色也是一种颜色。试着描述「无」。", en: "What color is nothingness? Not black — black is still a color. Try to describe 'nothing.'", src: "—— 海德格尔与存在的边界", enSrc: "— Heidegger & the boundary of being" },
  { q: "如果生命终将归于虚无，那此刻的意义从哪里来？", en: "If life ultimately returns to nothingness, where does the meaning of this moment come from?", src: "—— 加缪与荒谬", enSrc: "— Camus & the absurd" },
  { q: "如果「意义」是一种人类发明而不是宇宙属性——这意味着什么？是解放，还是虚无？", en: "If 'meaning' is a human invention rather than a property of the universe — is that liberating, or is it nihilism?", src: "—— 虚无主义与存在主义的岔路口", enSrc: "— Nihilism & existentialism at the crossroads" },
  { q: "你害怕的到底是死亡本身，还是「不再存在」这个念头？", en: "Are you afraid of death itself, or of the thought of 'no longer existing'?", src: "—— 伊壁鸠鲁：「我在，死不在；死在，我不在」", enSrc: "— Epicurus: 'When I am, death is not; when death is, I am not'" },
  { q: "西西弗斯推石头——你觉得他快乐吗？如果快乐，为什么？", en: "Sisyphus pushes his rock — do you think he is happy? If so, why?", src: "—— 加缪：「必须想象西西弗斯是快乐的」", enSrc: "— Camus: 'One must imagine Sisyphus happy'" },
  { q: "当你觉得一切都没有意义的时候，是什么让你继续走下去？", en: "When everything feels meaningless, what keeps you going?", src: "—— 日常生活中的存在主义", enSrc: "— Existentialism in everyday life" },
  { q: "荒诞感是什么？它从哪里来？是世界的错，还是我们期待的错？", en: "What is the feeling of absurdity? Where does it come from — is it the world's fault, or the fault of our expectations?", src: "—— 荒谬的诞生", enSrc: "— The birth of the absurd" },
  { q: "如果你只有一个月可以活，你会怎么过？——那你现在为什么不那么过？", en: "If you had only one month to live, how would you spend it? — So why aren't you living that way now?", src: "—— 死亡的警醒与拖延", enSrc: "— Death as wake-up call & procrastination" },
  { q: "希望是一种美德，还是一种幻觉？它让你前行，还是让你逃避现实？", en: "Is hope a virtue or an illusion? Does it help you move forward, or does it help you escape reality?", src: "—— 潘多拉魔盒与希望哲学", enSrc: "— Pandora's box & philosophy of hope" },
  { q: "如果宇宙对你毫不在意——这是令人绝望的，还是令人释然的？", en: "If the universe is utterly indifferent to you — is that devastating, or is it a relief?", src: "—— 宇宙视角下的存在", enSrc: "— Existence from a cosmic perspective" },
  { q: "虚无主义之后，还能有什么？", en: "After nihilism — what else is there?", src: "—— 尼采与价值重估", enSrc: "— Nietzsche & the revaluation of values" },

  // ── 时间与存在 / Time & Being ──
  { q: "你是在「度过」时间，还是在「成为」时间？", en: "Are you spending time, or are you becoming time?", src: "—— 柏格森与绵延（durée）", enSrc: "— Bergson & duration (durée)" },
  { q: "「现在」有多长？一秒钟？一瞬间？还是「现在」根本不存在？", en: "How long is 'now'? One second? A single instant? Or does 'now' not exist at all?", src: "—— 奥古斯丁与时间的悖论", enSrc: "— Augustine & the paradox of time" },
  { q: "过去还在吗？未来已经存在了吗？还是只有「此刻」是真实的？", en: "Does the past still exist? Has the future already happened? Or is only 'this moment' real?", src: "—— 时间哲学与永恒论", enSrc: "— Philosophy of time & eternalism" },
  { q: "如果可以回到过去——你会选择保留现在的记忆，还是重新经历一次？两者的区别是什么？", en: "If you could go back to the past — would you keep your present memories, or experience it all fresh again? What's the difference between the two?", src: "—— 记忆与经历的哲学差异", enSrc: "— Philosophical difference between memory & experience" },
  { q: "记忆是可靠的过去吗？还是每一次回忆，都是一次重新构造？", en: "Is memory a reliable record of the past? Or is every act of remembering an act of reconstruction?", src: "—— 记忆哲学与叙事同一性", enSrc: "— Philosophy of memory & narrative identity" },
  { q: "你是在用时间换生命，还是在用生命换时间？", en: "Are you trading time for life, or life for time?", src: "—— 时间经济学与生命价值", enSrc: "— Time economics & the value of life" },
  { q: "无聊的时间为什么过得慢，快乐的时间为什么过得快——时间有速度吗？", en: "Why does time crawl when you're bored and fly when you're happy — does time have a speed?", src: "—— 时间感知的现象学", enSrc: "— Phenomenology of time perception" },
  { q: "如果你能暂停时间，那一刻你感受到的自由是什么？——以及随之而来的孤独是什么？", en: "If you could pause time, what freedom would you feel in that moment? — And what loneliness would follow?", src: "—— 时间暂停思想实验", enSrc: "— Time-stop thought experiment" },
  { q: "衰老是你，还是发生在你身上的事？", en: "Is aging something you are, or something that happens to you?", src: "—— 衰老哲学与身体自我", enSrc: "— Philosophy of aging & the bodily self" },

  // ── 死亡 / Death ──
  { q: "你自己的死亡——你能想象它吗？还是每次你尝试想象时，你其实都在「旁观」？", en: "Your own death — can you imagine it? Or is every attempt to do so really just you watching from the outside?", src: "—— 死亡的现象学困境", enSrc: "— Phenomenological dilemma of death" },
  { q: "如果科技让你永生，你会选择永生吗？永生的代价是什么？", en: "If technology offered you immortality, would you take it? And what would immortality cost?", src: "—— 不朽与生命意义", enSrc: "— Immortality & the meaning of life" },
  { q: "你希望被记住吗？如果一千年后没有人记得你，你当下所做的一切还重要吗？", en: "Do you want to be remembered? If no one remembers you in a thousand years, does anything you do right now matter?", src: "—— 死亡与遗产", enSrc: "— Death & legacy" },
  { q: "死是生命的一部分，还是生命的反面？", en: "Is death a part of life, or the opposite of life?", src: "—— 死亡的本体论", enSrc: "— Ontology of death" },
  { q: "如果死后有来生——你会选择和这一世完全不同的人生，还是相似的人生？", en: "If there is an afterlife — would you choose a life completely different from this one, or something similar?", src: "—— 永恒轮回与选择", enSrc: "— Eternal recurrence & choice" },
  { q: "你最害怕失去的是什么？那个东西有一天会失去吗？", en: "What are you most afraid of losing? And will you lose it someday?", src: "—— 死亡焦虑与执念", enSrc: "— Death anxiety & attachment" },

  // ── 意识与心灵 / Consciousness & Mind ──
  { q: "你和他人的意识之间，隔着什么？你怎么知道别人也有内心世界？", en: "What stands between your consciousness and another's? How do you even know that other people have inner worlds?", src: "—— 他心问题（Problem of Other Minds）", enSrc: "— The Problem of Other Minds" },
  { q: "如果有一个人工智能能够完美模拟人类的对话和情感——它拥有意识吗？你怎么判断？", en: "If an AI could perfectly simulate human conversation and emotion — would it have consciousness? How would you tell?", src: "—— 图灵测试与意识的难题", enSrc: "— The Turing test & the hard problem of consciousness" },
  { q: "意识是什么？它是大脑产生的一种「分泌物」，还是一种根本不同的东西？", en: "What is consciousness? Is it a 'byproduct' of the brain, or something fundamentally different?", src: "—— 心身问题与「困难问题」", enSrc: "— Mind-body problem & the hard problem" },
  { q: "颜色存在于哪里？在物体表面，在你的眼睛里，还是在你的意识里？", en: "Where does color exist? On the surface of objects, in your eyes, or in your consciousness?", src: "—— 感受质（Qualia）与主观经验", enSrc: "— Qualia & subjective experience" },
  { q: "如果你能「进入」另一个人的意识一秒钟，你会想体验什么？", en: "If you could 'enter' another person's consciousness for one second — what would you want to experience?", src: "—— 主体间性与同理心的极限", enSrc: "— Intersubjectivity & the limits of empathy" },
  { q: "动物有意识吗？一只猫、一只鸟、一只蚂蚁——你在哪里划那条线？", en: "Are animals conscious? A cat, a bird, an ant — where do you draw the line?", src: "—— 动物意识与道德圈", enSrc: "— Animal consciousness & the moral circle" },
  { q: "当你「想」一件事的时候——那个「想」是什么材质的？它有形状吗？", en: "When you 'think' about something — what is that thought made of? Does it have a shape?", src: "—— 思维的现象学", enSrc: "— Phenomenology of thinking" },
  { q: "「我思故我在」——如果停止思考，「我」还存在吗？", en: "'I think, therefore I am' — if you stop thinking, does the 'I' still exist?", src: "—— 笛卡尔与存在的根基", enSrc: "— Descartes & the foundation of existence" },
  { q: "为什么会有「意识」这个东西存在？一个没有意识的世界不是更「经济」吗？", en: "Why does consciousness exist at all? Wouldn't a world without consciousness be more 'efficient'?", src: "—— 意识的进化谜题", enSrc: "— The evolutionary puzzle of consciousness" },

  // ── 语言与真实 / Language & Truth ──
  { q: "语言是思想的容器，还是思想的牢笼？那些你说不出的感受，它们真实存在吗？", en: "Is language a container for thought, or a prison? Those feelings you can't put into words — do they truly exist?", src: "—— 维特根斯坦：「语言的边界就是世界的边界」", enSrc: "— Wittgenstein: 'The limits of my language mean the limits of my world'" },
  { q: "沉默可以是一种语言吗？如果可以，它在说什么？", en: "Can silence be a language? If so, what is it saying?", src: "—— 沉默哲学与「不说之说」", enSrc: "— Philosophy of silence & 'speaking without speaking'" },
  { q: "如果你从未学过任何语言，你还能思考吗？你的思考会是什么样子？", en: "If you had never learned any language, could you still think? What would your thinking look like?", src: "—— 语言与思维的关系", enSrc: "— Language & thought" },
  { q: "有没有一种感受，你确定它存在，但你永远无法用语言传达给别人？", en: "Is there a feeling you are certain exists, but can never convey to anyone else in words?", src: "—— 私人语言论证", enSrc: "— The private language argument" },
  { q: "「真实」这个词本身是真实的吗？还是它只是一个方便的标签？", en: "Is the word 'truth' itself true? Or is it just a convenient label?", src: "—— 语言与实在论", enSrc: "— Language & realism" },
  { q: "当你说「我爱你」的时候，这三个字传达的是什么？是你真实的感受，还是一个社会约定的符号？", en: "When you say 'I love you,' what do those three words actually convey — your real feelings, or a socially agreed-upon symbol?", src: "—— 言语行为与情感真实性", enSrc: "— Speech acts & emotional authenticity" },
  { q: "谎言和虚构有什么区别？文学小说是不是一种「美丽的谎言」？", en: "What's the difference between a lie and fiction? Is a novel a kind of 'beautiful lie'?", src: "—— 虚构哲学与真理", enSrc: "— Philosophy of fiction & truth" },
  { q: "如果你把一生所有的话都录下来——那些话加起来，是你的全部吗？", en: "If you recorded every word you ever spoke — would the sum of them be the whole of who you are?", src: "—— 语言与存在的总和", enSrc: "— Language & the sum of existence" },

  // ── 爱与关系 / Love & Relations ──
  { q: "当你爱一个人的时候，你爱的是那个人本身，还是那个人给你带来的感受？", en: "When you love someone, do you love the person, or the feelings they give you?", src: "—— 爱的现象学", enSrc: "— Phenomenology of love" },
  { q: "爱是需求还是给予？如果你不需要任何人却还是选择了爱——那是什么？", en: "Is love a need or a gift? If you need no one and still choose to love — what is that?", src: "—— 爱的本质：匮乏还是溢出", enSrc: "— The nature of love: lack or overflow" },
  { q: "你能完全了解另一个人吗？如果不能，你爱的是一个「真实的人」还是一个「你的投射」？", en: "Can you ever fully know another person? If not, are you loving a real person or a projection of yourself?", src: "—— 他者与爱情的认识论", enSrc: "— The Other & epistemology of love" },
  { q: "孤独是缺少别人，还是缺少自己？", en: "Is loneliness the absence of others, or the absence of yourself?", src: "—— 孤独的两种形态", enSrc: "— Two forms of loneliness" },
  { q: "「在一起」意味着什么？两个人在同一个空间、度过同一段时间——这就是「在一起」吗？", en: "What does 'being together' mean? Two people in the same space, passing the same time — is that all it is?", src: "—— 共在（Mitsein）的现象学", enSrc: "— Phenomenology of Mitsein (being-with)" },
  { q: "如果你爱一个人，你应该希望他们成为最好的自己——即使那个「最好的自己」不包括你吗？", en: "If you love someone, should you want them to become their best self — even if that best self doesn't include you?", src: "—— 爱的伦理与自我牺牲", enSrc: "— Ethics of love & self-sacrifice" },
  { q: "人与人之间的「连接」是什么？它是一种实际存在的东西，还是一个我们共同制造的幻觉？", en: "What is 'connection' between people? Is it something that actually exists, or a shared illusion we create together?", src: "—— 连接的本体论", enSrc: "— Ontology of connection" },

  // ── 痛苦与幸福 / Suffering & Happiness ──
  { q: "痛苦有意义吗？如果有，这个意义是它自身具有的，还是我们赋予的？", en: "Does suffering have meaning? If so, does that meaning belong to suffering itself, or do we bestow it?", src: "—— 苦难的意义与尼采的「amor fati」", enSrc: "— The meaning of suffering & Nietzsche's 'amor fati'" },
  { q: "幸福是什么？是你得到你想要的，还是你想要你已经得到的？", en: "What is happiness? Getting what you want, or wanting what you already have?", src: "—— 欲望与满足的辩证法", enSrc: "— Dialectic of desire & satisfaction" },
  { q: "如果你能消除世界上所有的痛苦——你会吗？一个没有痛苦的世界是什么样的？", en: "If you could eliminate all suffering in the world — would you? What would a world without pain look like?", src: "—— 痛苦的必要性", enSrc: "— The necessity of suffering" },
  { q: "你不快乐是因为生活不够好，还是因为你期待的太多？", en: "Are you unhappy because life isn't good enough, or because you expect too much?", src: "—— 斯多亚主义与欲望管理", enSrc: "— Stoicism & desire management" },
  { q: "快乐和意义——如果只能选一个，你选哪个？", en: "Happiness or meaning — if you could only choose one, which would it be?", src: "—— 快乐主义 vs 意义导向", enSrc: "— Hedonism vs. meaning-orientation" },
  { q: "承受痛苦的能力是否比感受快乐的能力更值得尊敬？", en: "Is the capacity to endure suffering more admirable than the capacity to feel joy?", src: "—— 苦难的伦理地位", enSrc: "— The ethical status of suffering" },

  // ── 美与感知 / Beauty & Perception ──
  { q: "你上一次真正「看见」一棵树是什么时候？不是认出它是一棵树，而是看见它本身。", en: "When was the last time you truly saw a tree? Not recognized it as a tree, but actually saw it.", src: "—— 现象学：回到事物本身", enSrc: "— Phenomenology: return to the things themselves" },
  { q: "美是事物自身的属性，还是观看者内心的投射？", en: "Is beauty a property of the object itself, or a projection of the viewer's mind?", src: "—— 美学的基本问题", enSrc: "— The fundamental question of aesthetics" },
  { q: "丑的东西可以美吗？破碎的、残缺的、衰败的——有没有一种美藏在里面？", en: "Can something ugly be beautiful? The broken, the incomplete, the decaying — is there a beauty hidden inside?", src: "—— 否定美学与侘寂", enSrc: "— Negative aesthetics & wabi-sabi" },
  { q: "为什么有些音乐让你想哭？声音只是空气振动——情感从哪里来？", en: "Why does certain music make you want to cry? Sound is just air vibrating — where does the emotion come from?", src: "—— 音乐哲学与情感", enSrc: "— Philosophy of music & emotion" },
  { q: "如果你从未见过「美」这个概念——你还能感受到美吗？", en: "If you had never encountered the concept of 'beauty' — could you still feel it?", src: "—— 美的先天性与文化建构", enSrc: "— Innate beauty vs. cultural construction" },
  { q: "宇宙是美的吗？如果是，这种美是为谁而存在的？", en: "Is the universe beautiful? If so, who is that beauty for?", src: "—— 宇宙美学与目的论", enSrc: "— Cosmic aesthetics & teleology" },
  { q: "日落为什么感人？是因为它美，还是因为它短暂？", en: "Why does a sunset move us? Because it is beautiful, or because it is fleeting?", src: "—— 时间性与审美体验", enSrc: "— Temporality & aesthetic experience" },

  // ── 知识与真实 / Knowledge & Truth ──
  { q: "你怎么知道你此刻不是在做梦？不是在一个模拟器中？", en: "How do you know you're not dreaming right now? Or living in a simulation?", src: "—— 笛卡尔的怀疑与模拟假说", enSrc: "— Cartesian doubt & the simulation hypothesis" },
  { q: "「知道」一件事意味着什么？是你能背出来，还是你能感觉到，还是你能用出来？", en: "What does it mean to 'know' something? That you can recite it, feel it, or apply it?", src: "—— 知识的定义与葛梯尔问题", enSrc: "— Definition of knowledge & the Gettier problem" },
  { q: "真理存在吗？如果存在，它是被发现的，还是被发明的？", en: "Does truth exist? If so, is it discovered or invented?", src: "—— 真理符合论 vs 建构论", enSrc: "— Correspondence theory vs. constructivism" },
  { q: "科学和艺术——谁更接近真实？还是它们面对的是不同的真实？", en: "Science and art — which gets closer to truth? Or are they approaching different kinds of truth?", src: "—— 两种知识的分界", enSrc: "— Two kinds of knowledge" },
  { q: "你相信的东西是你选择的，还是你被说服的？相信和知道有什么不同？", en: "Do you choose what you believe, or are you persuaded? What's the difference between belief and knowledge?", src: "—— 信念伦理学", enSrc: "— Ethics of belief" },
  { q: "如果全世界都相信一件事——这件事就变成真的了吗？", en: "If everyone in the world believed something — would it become true?", src: "—— 真理与社会建构", enSrc: "— Truth & social construction" },
  { q: "有些东西你必须先相信，才能理解——这是知识的起点还是信仰的陷阱？", en: "Some things you must first believe in order to understand — is that the starting point of knowledge or the trap of faith?", src: "—— 安瑟伦 vs 证据主义", enSrc: "— Anselm vs. evidentialism" },
  { q: "无知是不是一种选择？在某些时候，知道更多是否反而更痛苦？", en: "Is ignorance a choice? Are there times when knowing more only brings more pain?", src: "—— 无知的权利与知识伦理", enSrc: "— The right to ignorance & ethics of knowledge" },

  // ── 伦理与正义 / Ethics & Justice ──
  { q: "如果一个行为出于善意却导致了灾难——它是善的还是恶的？道德评判应该看动机还是看结果？", en: "If an action born of good intentions leads to disaster — is it good or evil? Should morality judge by motive or by outcome?", src: "—— 义务论 vs 后果论", enSrc: "— Deontology vs. consequentialism" },
  { q: "你是否对陌生人负有责任？如果是，这种责任从哪里来？如果不是，为什么？", en: "Do you have a responsibility toward strangers? If so, where does that responsibility come from?", src: "—— 普世伦理与道德圈", enSrc: "— Universal ethics & the moral circle" },
  { q: "如果可以牺牲一个人来救五个人——你会按那个按钮吗？", en: "If you could sacrifice one person to save five — would you press the button?", src: "—— 电车难题与道德直觉", enSrc: "— The trolley problem & moral intuition" },
  { q: "宽恕是什么？是忘记、是放下、还是一种更高的力量？", en: "What is forgiveness? Is it forgetting, letting go, or something more powerful?", src: "—— 宽恕的哲学", enSrc: "— Philosophy of forgiveness" },
  { q: "你是一个好人吗？你用什么标准来判断？", en: "Are you a good person? By what standard do you judge?", src: "—— 道德自我评价", enSrc: "— Moral self-evaluation" },

  // ── 中国哲学 / Chinese Philosophy ──
  { q: "「无为」不是什么都不做——那它到底是什么？你在生活中体验过「无为」吗？", en: "'Wu wei' doesn't mean doing nothing — so what does it mean? Have you ever experienced it in your own life?", src: "—— 老子与无为之道", enSrc: "— Laozi & the way of wu wei" },
  { q: "「庄周梦蝶」——如果人生是一场大梦，你愿意醒来吗？", en: "'Zhuangzi dreamed he was a butterfly' — if life is but a dream, would you want to wake up?", src: "—— 庄子与存在的虚幻性", enSrc: "— Zhuangzi & the illusory nature of existence" },
  { q: "水是最柔软的，却能穿石。你生命中有没有「柔软胜刚强」的体验？", en: "Water is the softest thing, yet it wears away stone. Have you seen 'softness overcoming hardness' in your own life?", src: "—— 老子与柔弱哲学", enSrc: "— Laozi & the philosophy of softness" },
  { q: "「仁」是什么？是爱别人，是同理心，还是别的什么？", en: "What is 'ren'? Is it love for others, empathy, or something else entirely?", src: "—— 孔子与仁的伦理", enSrc: "— Confucius & the ethics of ren" },
  { q: "「心外无物」——如果你没有看见一朵花，那朵花还存在吗？", en: "'There is nothing outside the mind' — if you never saw a flower, would that flower still exist?", src: "—— 王阳明与心学", enSrc: "— Wang Yangming & the School of Mind" },
  { q: "「道可道，非常道」——最真的东西是不是永远说不出来？那些说出来的，是不是已经偏离了真实？", en: "'The Dao that can be spoken is not the eternal Dao' — is the truest thing always unsayable? Does speaking it already distort it?", src: "—— 老子与语言的局限", enSrc: "— Laozi & the limits of language" },
  { q: "「吾丧我」是什么意思？失去了「我」，剩下的是什么？", en: "What does 'I have lost myself' mean? When you lose the 'I,' what remains?", src: "—— 庄子与自我的消解", enSrc: "— Zhuangzi & the dissolution of self" },
  { q: "有用和无用——大树因为「无用」而活千年，你觉得自己「有用」吗？谁定义的「有用」？", en: "The useful and the useless — a great tree lives a thousand years because it is 'useless.' Do you consider yourself useful? Who defines what useful means?", src: "—— 庄子与效用批判", enSrc: "— Zhuangzi & the critique of utility" },
  { q: "「天人合一」是一种感受还是一个事实？你体验过和自然「合一」的瞬间吗？", en: "Is 'the unity of heaven and humanity' a feeling or a fact? Have you ever experienced a moment of oneness with nature?", src: "—— 中国哲学中的天人关系", enSrc: "— The heaven-human relationship in Chinese philosophy" },

  // ── 技术与现代 / Technology & Modernity ──
  { q: "手机是你的延伸，还是你的替代品？当它扩展你的同时，是否也截断了什么？", en: "Is your phone an extension of you, or a replacement? As it expands your reach, does it also sever something?", src: "—— 麦克卢汉与技术哲学", enSrc: "— McLuhan & philosophy of technology" },
  { q: "社交网络上的「你」和真实的你——谁更真实？还是各有各的真实？", en: "The 'you' on social media and the real you — which is more real? Or does each have its own kind of reality?", src: "—— 数字身份与真实性", enSrc: "— Digital identity & authenticity" },
  { q: "算法比你更了解你的欲望——那你还是你欲望的主人吗？", en: "Algorithms know your desires better than you do — so are you still the master of your own desires?", src: "—— 算法治理与自主性", enSrc: "— Algorithmic governance & autonomy" },
  { q: "技术进步让我们更自由了吗？还是我们只是换了一种方式被束缚？", en: "Has technology made us freer? Or have we simply traded one form of bondage for another?", src: "—— 技术决定论 vs 技术工具论", enSrc: "— Technological determinism vs. instrumentalism" },
  { q: "如果 AI 能写诗、画画、作曲——艺术还是艺术吗？还是艺术必须来自人的灵魂？", en: "If AI can write poetry, paint, and compose music — is it still art? Or must art come from a human soul?", src: "—— AI 与创造力的哲学", enSrc: "— AI & the philosophy of creativity" },

  // ── 日常中的哲学 / Philosophy in Everyday Life ──
  { q: "你上一次感到「惊奇」是什么时候？惊奇和好奇有什么不同？", en: "When was the last time you felt wonder? And how is wonder different from curiosity?", src: "—— 哲学始于惊奇（亚里士多德）", enSrc: "— Philosophy begins in wonder (Aristotle)" },
  { q: "等待是什么？你是在等待某个东西，还是在等待中度过了你的生命？", en: "What is waiting? Are you waiting for something, or are you spending your life in waiting?", src: "—— 等待的现象学", enSrc: "— Phenomenology of waiting" },
  { q: "「家」是什么？是一个地方、一种感觉、还是某些人的存在？", en: "What is 'home'? A place, a feeling, or the presence of certain people?", src: "—— 海德格尔的「栖居」", enSrc: "— Heidegger's 'dwelling'" },
  { q: "仪式感为什么重要？重复的动作和话语，如何承载意义？", en: "Why does ritual matter? How do repeated actions and words carry meaning?", src: "—— 日常仪式与意义建构", enSrc: "— Everyday ritual & meaning-making" },
  { q: "游戏和工作有什么区别？如果工作让你快乐，它是不是就成了游戏？", en: "What's the difference between play and work? If work makes you happy, does it become play?", src: "—— 游戏哲学与劳动意义", enSrc: "— Philosophy of play & the meaning of labor" },
  { q: "「无聊」是什么？它是不是一种信号——提醒你某些东西缺失了？", en: "What is boredom? Is it a signal — reminding you that something is missing?", src: "—— 无聊的存在主义解读", enSrc: "— An existentialist reading of boredom" },
  { q: "散步的时候，你的思绪去了哪里？身体在走，灵魂也在走吗？", en: "When you take a walk, where does your mind go? Your body is walking — is your soul walking too?", src: "—— 行走与思考的现象学", enSrc: "— Phenomenology of walking & thinking" },
  { q: "为什么告别总是沉重的？再见的那一刻，到底在告别什么？", en: "Why are goodbyes always heavy? In the moment of farewell, what exactly are we parting from?", src: "—— 告别与时间的体验", enSrc: "— Farewell & the experience of time" },
  { q: "「日常」是最难被看见的东西——为什么最重要的事物反而最容易被忽略？", en: "The everyday is the hardest thing to see — why are the most important things the easiest to overlook?", src: "—— 海德格尔与上手状态", enSrc: "— Heidegger & readiness-to-hand" },

  // ── 终极问题 / Ultimate Questions ──
  { q: "为什么有存在，而不是什么都没有？", en: "Why is there something rather than nothing?", src: "—— 莱布尼茨与海德格尔的终极之问", enSrc: "— Leibniz & Heidegger's ultimate question" },
  { q: "宇宙有目的吗？如果有，是谁或什么赋予的？如果没有，那我们为什么要做任何事？", en: "Does the universe have a purpose? If so, who or what gave it one? If not, why do anything at all?", src: "—— 目的论与宇宙意义", enSrc: "— Teleology & cosmic meaning" },
  { q: "如果宇宙是一个巨大的巧合——这个巧合本身，算不算一种奇迹？", en: "If the universe is one vast coincidence — isn't that coincidence itself a kind of miracle?", src: "—— 偶然性与惊奇", enSrc: "— Contingency & wonder" },
  { q: "神存在吗？如果不存在，为什么几乎每个文明都发明了神？如果存在，为什么有那么多不同的神？", en: "Does God exist? If not, why has nearly every civilization invented gods? If so, why are there so many different ones?", src: "—— 宗教哲学的基本张力", enSrc: "— The fundamental tension of philosophy of religion" },
  { q: "第一个生命是怎么从非生命中诞生的？那个「活过来」的瞬间，发生了什么？", en: "How did the first life emerge from non-life? In that moment of 'coming alive' — what happened?", src: "—— 生命起源与活力论", enSrc: "— Origin of life & vitalism" },

  // ── 更多问题 / More Questions ──
  { q: "你能真正「原谅」一个人吗？原谅意味着什么——忘记伤害、还是超越伤害？", en: "Can you truly forgive someone? What does forgiveness mean — forgetting the harm, or transcending it?", src: "—— 宽恕哲学的深度", enSrc: "— Depth of the philosophy of forgiveness" },
  { q: "孤独和独处是一回事吗？一个人可以在人群中感到孤独吗？", en: "Are loneliness and solitude the same thing? Can a person feel lonely in a crowd?", src: "—— 孤独的现象学区分", enSrc: "— Phenomenological distinction of loneliness" },
  { q: "你的「性格」是你选择的结果还是环境塑造的产物？如果是后者，你该为自己的行为负责吗？", en: "Is your personality the result of your choices, or the product of your environment? If the latter, are you still responsible for your actions?", src: "—— 性格与道德责任", enSrc: "— Character & moral responsibility" },
  { q: "「成长」意味着什么？是你变得更好了，还是你变得更能适应了？", en: "What does 'growth' mean? Becoming a better person, or becoming better at adapting?", src: "—— 成长哲学的批判", enSrc: "— Critique of growth philosophy" },
  { q: "遗忘是一种缺陷还是一种能力？如果什么都忘不掉，生活还能继续吗？", en: "Is forgetting a flaw or a capability? If you could forget nothing, could life go on?", src: "—— 遗忘的哲学与博尔赫斯", enSrc: "— Philosophy of forgetting & Borges" },
  { q: "「正常」是谁定义的？偏离「正常」是自由还是危险？", en: "Who defines 'normal'? Is deviating from the norm freedom or danger?", src: "—— 福柯与正常化的权力", enSrc: "— Foucault & the power of normalization" },
  { q: "欲望满足之后的那一瞬间——你感受到的是什么？是满足，还是空虚？", en: "In the moment right after a desire is fulfilled — what do you feel? Satisfaction, or emptiness?", src: "—— 欲望结构与享乐悖论", enSrc: "— Structure of desire & the pleasure paradox" },
  { q: "羡慕和嫉妒的区别是什么？哪一个更接近「爱」？", en: "What's the difference between admiration and envy? Which one is closer to love?", src: "—— 情感现象学", enSrc: "— Phenomenology of emotions" },
  { q: "如果你是另一个人，你会和现在的你成为朋友吗？", en: "If you were someone else, would you be friends with the person you are now?", src: "—— 自我认知的视角转换", enSrc: "— Perspective shift in self-knowledge" },
  { q: "时间是线性的吗？还是我们在回忆和期待中，不断地重新编织它？", en: "Is time linear? Or do we constantly reweave it through memory and anticipation?", src: "—— 叙事时间与线性时间", enSrc: "— Narrative time & linear time" },
  { q: "你是否曾经在音乐中「消失」？当一首曲子结束，你回到自己——那个「消失」的你去哪了？", en: "Have you ever 'disappeared' into music? When the piece ends and you return to yourself — where did the you that vanished go?", src: "—— 音乐与自我消融体验", enSrc: "— Music & ego dissolution" },
  { q: "如果你把一个物体上的每一个原子都替换掉——它还是原来那个物体吗？你也是同理吗？", en: "If you replaced every atom of an object — is it still the same object? And by the same logic, are you still you?", src: "—— 忒修斯之船与人格同一性", enSrc: "— Ship of Theseus & personal identity" },
  { q: "「直觉」是什么？它是未经思考的知识，还是思考之前的某种东西？", en: "What is intuition? Knowledge without thinking, or something that precedes thought?", src: "—— 直觉的认识论", enSrc: "— Epistemology of intuition" },
  { q: "承诺的力量从哪来？说出一句话——「我答应你」——怎么就能约束未来的行为？", en: "Where does the power of a promise come from? How do a few words — 'I promise' — bind future actions?", src: "—— 言语行为哲学与承诺", enSrc: "— Speech act philosophy & promises" },
  { q: "如果你知道你永远不会被抓住，你会做一些你平时不做的事吗？那这些事反映了你的「真实自我」吗？", en: "If you knew you'd never be caught, would you do things you normally wouldn't? Would those acts reveal your 'true self'?", src: "—— 道德与隐秘自我", enSrc: "— Morality & the hidden self" },
  { q: "你能为自己不存在的想法负责吗？一个突然闯入脑海的恶念，是你的吗？", en: "Can you be responsible for a thought you didn't choose to have? A dark impulse that flashes into your mind — is it yours?", src: "—— 思想的所有权与道德责任", enSrc: "— Ownership of thoughts & moral responsibility" },
  { q: "什么都不做，做白日梦——这是浪费时间，还是生命中最重要的事？", en: "Doing nothing, daydreaming — is it a waste of time, or the most important thing in life?", src: "—— 闲散的哲学辩护", enSrc: "— In defense of idleness" },
  { q: "你的身体在变老，但你的「内心」似乎停留在了某个年龄——那个年龄是几岁？", en: "Your body ages, but your 'inner self' seems to have stopped at a certain age — how old is that age?", src: "—— 主观年龄与时间体验", enSrc: "— Subjective age & temporal experience" },
  { q: "「命运」这个词——是解释过去的修辞，还是指引未来的力量？", en: "The word 'fate' — is it a rhetorical device for explaining the past, or a force that guides the future?", src: "—— 命运概念的解构", enSrc: "— Deconstructing fate" },
  { q: "如果你不能和任何人交流——你的思想还能存在吗？它们还是思想吗？", en: "If you could never communicate with anyone — would your thoughts still exist? Would they still be thoughts?", src: "—— 孤独心灵中的语言与思维", enSrc: "— Language & thought in a solitary mind" },
  { q: "你在镜子中看到的那个人，是你，还是你的「反面」？左边和右边互换了，他还是你吗？", en: "The person you see in the mirror — is that you, or your 'reverse'? Left and right are swapped — is it still you?", src: "—— 镜像自我与身体图式", enSrc: "— Mirror self & body schema" },
  { q: "什么是「经验」？做同一件事一百次，你获得的是经验还是习惯？经验和习惯有什么区别？", en: "What is 'experience'? Do something a hundred times — do you gain experience or habit? What's the difference?", src: "—— 经验的哲学分析", enSrc: "— Philosophical analysis of experience" },
  { q: "「天赋」真的存在吗？如果有，拥有天赋的人应该因此得到更多吗？", en: "Does 'talent' really exist? If so, should those who have it get more because of it?", src: "—— 天赋与分配正义", enSrc: "— Talent & distributive justice" },
  { q: "一个人可以同时是善的又是恶的吗？还是善恶是不同层面的东西？", en: "Can a person be both good and evil at the same time? Or do good and evil exist on different planes?", src: "—— 道德复杂性", enSrc: "— Moral complexity" },
  { q: "思想的速度有多快？你能控制自己思考的速度吗？", en: "How fast does thought travel? Can you control the speed of your own thinking?", src: "—— 思维速度的现象学", enSrc: "— Phenomenology of thought speed" },
  { q: "「安静」是一种声音吗？如果你在一个绝对安静的空间里，你听到的是什么？", en: "Is silence a sound? If you were in a perfectly silent space, what would you hear?", src: "—— 寂静的感知哲学", enSrc: "— Philosophy of silence perception" },
  { q: "幽默是什么？为什么有些东西「好笑」？笑的时候，你在笑什么？", en: "What is humor? Why is something 'funny'? When you laugh, what are you really laughing at?", src: "—— 幽默哲学与笑的本质", enSrc: "— Philosophy of humor & the nature of laughter" },
  { q: "「足够」是多少？什么时候你拥有的东西「够了」？", en: "How much is 'enough'? When do you have 'enough' of something?", src: "—— 满足的哲学与欲望的终结", enSrc: "— Philosophy of sufficiency & the end of desire" },
  { q: "意外发生的时候——比如打翻一杯水——那一刻你的反应，暴露了你的什么？", en: "When something unexpected happens — like knocking over a glass of water — what does your reaction in that instant reveal about you?", src: "—— 微小事件中的自我揭示", enSrc: "— Self-revelation in small moments" },
  { q: "什么是「成熟」？是变得更理性，还是变得更能接受自己非理性的一面？", en: "What is 'maturity'? Becoming more rational, or becoming more accepting of your irrational side?", src: "—— 成熟概念的批判", enSrc: "— Critique of maturity" },
  { q: "你和童年的你——如果见面了，你们会认出对方吗？", en: "You and your childhood self — if you met, would you recognize each other?", src: "—— 童年自我与成年自我的连续性", enSrc: "— Continuity between childhood & adult self" },

  // ── 更多冲击力的问题 / Provocative Questions ──
  { q: "「我不知道」——这是不是你最诚实的一句话？", en: "'I don't know' — is that the most honest thing you've ever said?", src: "—— 苏格拉底与知无知", enSrc: "— Socrates & knowing that you know nothing" },
  { q: "此刻你呼吸的空气——它曾经穿过多少人的肺？这个想法让你感到连接还是恐惧？", en: "The air you're breathing right now — how many lungs has it passed through? Does that thought make you feel connected, or afraid?", src: "—— 物质循环与存在连接", enSrc: "— Material cycles & existential connection" },
  { q: "你有多少想法是你自己的？有多少是你从别人那里借来、却以为是自己的？", en: "How many of your thoughts are truly your own? How many have you borrowed from others and mistaken for your own?", src: "—— 思想的所有权", enSrc: "— Ownership of thoughts" },
  { q: "当你生气的时候——是「你」在生气，还是某个比「你」更古老的东西借你的身体在生气？", en: "When you get angry — is it 'you' who is angry, or something older than you, borrowing your body to express its rage?", src: "—— 情绪的自我与非自我", enSrc: "— Self & non-self in emotion" },
  { q: "你生命中最重要的决定——它们是在清醒的状态下做的，还是在某种恍惚中？", en: "The most important decisions of your life — were they made in full clarity, or in some kind of trance?", src: "—— 重大决策的现象学", enSrc: "— Phenomenology of big decisions" },
  { q: "如果把你一生的所有瞬间拍成一部电影——你会看吗？你会快进哪些部分？", en: "If every moment of your life were made into a film — would you watch it? Which parts would you fast-forward through?", src: "—— 生命全景回顾", enSrc: "— The panoramic review of a life" },
  { q: "什么是「准备好了」？有没有什么事是你永远也「没有准备好」的？", en: "What does it mean to be 'ready'? Is there something you will never be ready for?", src: "—— 准备与行动之间", enSrc: "— Between preparation & action" },
  { q: "「最后一次」——当你意识到这是最后一次做某件事的时候，那种感觉叫什么？", en: "'The last time' — when you realize it's the last time you'll ever do something, what is that feeling called?", src: "—— 终末体验的现象学", enSrc: "— Phenomenology of final experiences" },
  { q: "你是否有过「被看见」的体验？不是被眼睛看见，而是被另一个灵魂认出了你。", en: "Have you ever felt truly 'seen'? Not by someone's eyes, but by another soul recognizing you.", src: "—— 承认与主体间性", enSrc: "— Recognition & intersubjectivity" },

async function shareEntry(id) {
  const isZh = L === 'zh';
  const entries = getEntries();
  const e = entries.find(en => en.id === id);
  if (!e) return;

  const question = e.prompt || '';
  // 构建完整对话文本（如果有线程）
  let fullText = '';
  if (e.thread && e.thread.length > 0) {
    fullText = e.thread.map(m =>
      (m.role === 'user' ? (L==='zh'?'我：':'Me: ') : 'Claude：') + m.text
    ).join('\n\n');
  } else {
    fullText = e.text;
  }

  // 弹窗显示加载中
  document.getElementById('modalContent').innerHTML =
    '<div style="text-align:center; padding:40px;">'
    + '<div class="spinner" style="width:24px;height:24px;border-width:3px;margin:0 auto 16px;"></div>'
    + '<div style="color:rgba(200,200,220,0.5);">' + (isZh?'AI 正在精炼你的回答…':'AI is refining your answer…') + '</div>'
    + '</div>';
  document.getElementById('modalOverlay').style.display = 'flex';

  // 调用 AI 精炼（回退：截取全文前200字）
  let summary = fullText.length > 200 ? fullText.slice(0, 200) + '…' : fullText;
  try {
    const r = await fetch(API_BASE + '/api/summarize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ text: fullText, prompt: question }),
      signal: AbortSignal.timeout(30000),
    });
    if (r.ok) {
      const d = await r.json();
      if (d.summary) summary = d.summary;
    }
  } catch(x) {}

  // 生成卡片
  const img = generateCardImage(question, '', summary);
  const imgSrc = img.toDataURL('image/png');

  document.getElementById('modalContent').innerHTML =
    '<div style="text-align:center;">'
    + '<div style="font-size:0.85rem; color:var(--accent); margin-bottom:8px;">' + (isZh?'预览分享卡片':'Preview Share Card') + '</div>'
    + '<img src="' + imgSrc + '" style="width:100%; max-width:375px; border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,0.4);">'
    + '<div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; justify-content:center;">'
    + '<button class="btn primary" onclick="downloadShareCard()">📥 ' + (isZh?'保存图片':'Save Image') + '</button>'
    + '<button class="btn" onclick="shareImage()">📤 ' + (isZh?'分享':'Share') + '</button>'
    + '<button class="close-btn" onclick="closeModal()">' + (isZh?'关闭':'Close') + '</button>'
    + '</div></div>';
  document.getElementById('modalOverlay').style.display = 'flex';

  // 存到全局供下载用
  window._shareCardImage = img;
}

function generateCardImage(question, source, answer) {
  const w = 750, h = 1334; // 手机竖屏比例
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');

  // 背景
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#0e0e1a');
  grad.addColorStop(0.5, '#0a0a14');
  grad.addColorStop(1, '#0c0c18');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // 星星
  for (let i = 0; i < 50; i++) {
    ctx.fillStyle = `rgba(200,210,240,${Math.random()*0.2+0.03})`;
    ctx.beginPath(); ctx.arc(Math.random()*w, Math.random()*h*0.6, Math.random()*1.2+0.2, 0, Math.PI*2); ctx.fill();
  }

  // 品牌顶部
  ctx.fillStyle = 'rgba(212,168,84,0.5)';
  ctx.font = '24px serif';
  ctx.textAlign = 'center';
  ctx.fillText('思·在  THINKING · BEING', w/2, 80);

  ctx.strokeStyle = 'rgba(212,168,84,0.1)';
  ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(w/2-100, 105); ctx.lineTo(w/2+100, 105); ctx.stroke();

  // 问题
  if (question) {
    ctx.fillStyle = 'rgba(212,168,84,0.8)';
    ctx.font = '26px "Noto Serif SC", serif';
    const qLines = wrapText(ctx, '「' + question + '」', w - 160);
    let qY = 170;
    qLines.forEach(line => {
      ctx.fillText(line, w/2, qY);
      qY += 44;
    });
    var answerY = qY + 40;
  } else {
    var answerY = 200;
  }

  if (answer) {
    // 分割线
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.beginPath(); ctx.moveTo(w/2-80, answerY-10); ctx.lineTo(w/2+80, answerY-10); ctx.stroke();

    // 回答
    ctx.fillStyle = '#d0d0dc';
    ctx.font = '28px "Noto Serif SC", serif';
    const aLines = wrapText(ctx, answer, w - 140);
    let aY = answerY + 40;
    aLines.forEach(line => {
      ctx.fillText(line, w/2, aY);
      aY += 48;
    });
  }

  // 底部品牌
  const footerY = h - 120;
  ctx.fillStyle = 'rgba(200,200,220,0.12)';
  ctx.font = '20px sans-serif';
  ctx.fillText('思·在 · 哲学思辨花园', w/2, footerY);
  ctx.fillStyle = 'rgba(200,200,220,0.08)';
  ctx.font = '16px sans-serif';
  ctx.fillText('fuuuuan.github.io/sizai', w/2, footerY + 30);
  if (source) {
    ctx.fillStyle = 'rgba(200,200,220,0.2)';
    ctx.font = '18px serif';
    ctx.fillText(source, w/2, footerY - 40);
  }

  return c;
}

function downloadShareCard() {
  if (!window._shareCardImage) return;
  const url = window._shareCardImage.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url; a.download = 'sizai-card.png'; a.click();
}

async function shareImage() {
  if (!window._shareCardImage) return;
  const blob = await new Promise(r => window._shareCardImage.toBlob(r, 'image/png'));
  if (navigator.share && navigator.canShare && blob) {
    const file = new File([blob], 'sizai-card.png', { type: 'image/png' });
    try {
      await navigator.share({ title: '思·在', text: '', files: [file] });
      return;
    } catch(e) {}
  }
  // fallback: 下载
  downloadShareCard();
  toast(L==='zh'?'已下载（此浏览器不支持直接分享）':'Downloaded (share not supported)');
}

function wrapText(ctx, text, maxWidth) {
  const lines = [];
  let current = '';
  for (const char of text) {
    const test = current + char;
    if (ctx.measureText(test).width > maxWidth && current.length > 0) {
      lines.push(current);
      current = char;
    } else {
      current = test;
    }
  }
  if (current) lines.push(current);
  return lines;
}

let apiOnline = false;
let currentQuestion = null;

function getDailySeed() {
  const today = new Date().toISOString().slice(0, 10);
  let hash = 0;
  for (let i = 0; i < today.length; i++) {
    hash = ((hash << 5) - hash) + today.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function getDailyQuestion() {
  const today = new Date().toISOString().slice(0, 10);
  // Check if we already have today's question cached
  const stored = localStorage.getItem('sizai_daily');
  if (stored) {
    try {
      const data = JSON.parse(stored);
      // 旧缓存可能没有 en 字段，补齐
      if (data.date === today && data.q) {
        if (!data.en && data.index !== undefined && QUESTION_BANK[data.index]) {
          data.en = QUESTION_BANK[data.index].en;
          data.enSrc = QUESTION_BANK[data.index].enSrc;
          localStorage.setItem('sizai_daily', JSON.stringify(data));
        }
        return data;
      }
    } catch(e) {}
  }
  // Pick: avoid recently used daily questions
  const used = JSON.parse(localStorage.getItem('sizai_daily_history') || '[]');
  let available = QUESTION_BANK.map((q, i) => i).filter(i => !used.includes(i));
  if (available.length === 0) {
    available = QUESTION_BANK.map((_, i) => i); // all used, reset
    used.length = 0;
  }
  const seed = getDailySeed();
  const idx = available[seed % available.length];
  const picked = { date: today, index: idx, ...QUESTION_BANK[idx], source: 'bank' };
  localStorage.setItem('sizai_daily', JSON.stringify(picked));
  // Track used questions
  used.push(idx);
  if (used.length > 90) used.shift(); // keep last 90 days
  localStorage.setItem('sizai_daily_history', JSON.stringify(used));
  return picked;
}

function pickRandomQuestion() {
  // Avoid repeating the last few shown questions
  const recent = JSON.parse(localStorage.getItem('sizai_recent') || '[]');
  let available = QUESTION_BANK.filter((_, i) => !recent.includes(i));
  if (available.length === 0) {
    available = QUESTION_BANK;
    recent.length = 0;
  }
  const idx = QUESTION_BANK.indexOf(available[Math.floor(Math.random() * available.length)]);
  // Keep track of last 30 shown to minimize repeats
  recent.push(idx);
  if (recent.length > 30) recent.shift();
  localStorage.setItem('sizai_recent', JSON.stringify(recent));
  return { ...QUESTION_BANK[idx], source: 'bank' };
}

function displayQuestion(data) {
  if (!data) data = getDailyQuestion();
  // 确保英文字段存在（从题库补齐）
  if (!data.en && data.index !== undefined && QUESTION_BANK[data.index]) {
    data.en = QUESTION_BANK[data.index].en;
    data.enSrc = QUESTION_BANK[data.index].enSrc;
  }
  currentQuestion = data;
  const isZh = L === 'zh';
  document.getElementById('questionText').textContent = isZh ? data.q : (data.en || data.q);
  document.getElementById('questionSource').textContent = isZh ? data.src : (data.enSrc || data.src);
  if (data.source === 'ai') {
    document.getElementById('questionLabel').innerHTML = (isZh ? 'AI 之问' : 'AI Question') + ' <span class="question-badge">' + (isZh ? '实时生成' : 'Live') + '</span>';
  } else {
    document.getElementById('questionLabel').textContent = isZh ? '今日之问' : 'Today\'s Question';
  }
  const br = document.getElementById('btnRefresh');
  if (br) br.textContent = isZh ? '↻ 换一个问题' : '↻ New Question';
  const ba = document.getElementById('btnAI');
  if (ba) ba.textContent = isZh ? '✦ AI 生成' : '✦ AI Generate';
  if (ba && ba.nextElementSibling) ba.nextElementSibling.textContent = isZh ? '✎ 回应这个问题' : '✎ Respond';
}

async function refreshQuestion() {
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  btn.textContent = '…';

  // Try AI first if online
  if (apiOnline) {
    try {
      const q = await fetchFromAPI();
      if (q) {
        currentQuestion = { ...q, source: 'ai' };
        displayQuestion(currentQuestion);
        btn.disabled = false;
        btn.textContent = '↻ 换一个问题';
        return;
      }
    } catch(e) {}
  }

  // Fall back to bank
  const q = pickRandomQuestion();
  currentQuestion = q;
  displayQuestion(q);
  btn.disabled = false;
  btn.textContent = '↻ 换一个问题';
}

async function fetchAIQuestion() {
  const btn = document.getElementById('btnAI');
  btn.disabled = true;
  const origText = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span> 生成中…';

  try {
    const q = await fetchFromAPI();
    if (q) {
      currentQuestion = { ...q, source: 'ai' };
      displayQuestion(currentQuestion);
      toast('✦ AI 生成的全新问题');
    }
  } catch(e) {
    // Fall back to bank
    const q = pickRandomQuestion();
    currentQuestion = q;
    displayQuestion(q);
    if (!apiOnline) {
      toast('AI 服务器未连接，使用本地题库');
    } else {
      toast('生成失败，使用本地题库');
    }
  }

  btn.disabled = false;
  btn.innerHTML = origText;
}

async function fetchFromAPI() {
  const resp = await fetch(`${API_BASE}/api/question`, {
    headers: authHeaders(),
    signal: AbortSignal.timeout(50000)  // Render 冷启动需要时间
  });
  if (!resp.ok) throw new Error('API error');
  const data = await resp.json();
  if (data.error) throw new Error(data.error);
  return { ...data, source: 'ai' };
}

async function checkAPIStatus() {
  const st = document.getElementById('apiStatus');
  st.textContent = L==='zh'?'正在连接服务器…':'Connecting to server…';
  try {
    const resp = await fetch(`${API_BASE}/api/ping`, {
      signal: AbortSignal.timeout(45000)  // Render 冷启动最多等 45 秒
    });
    const data = await resp.json();
    if (data.ok) {
      apiOnline = true;
      needsAuth = data.needs_auth || false;
      const hasKey = data.has_api_key;
      document.getElementById('apiStatus').textContent = hasKey ? t('status_online') : t('status_server');
      document.getElementById('apiStatus').className = 'api-status online';
      document.getElementById('btnAI').style.display = hasKey ? '' : '';
      if (needsAuth && !accessCode) showAuthPrompt();
      refreshUI();
      return;
    }
  } catch(e) {}
  apiOnline = false;
  needsAuth = false;
  document.getElementById('apiStatus').textContent = t('status_local') + ' · 170+';
  document.getElementById('apiStatus').className = 'api-status offline';
  document.getElementById('btnAI').style.display = '';
  refreshUI();
}

function saveEntry() {
  const text = document.getElementById('writeArea').value.trim();
  if (!text) { toast('先写点什么吧'); return; }
  const entries = getEntries();
  let savedEntry = null;

  if (editingId) {
    const idx = entries.findIndex(e => e.id === editingId);
    if (idx >= 0) {
      entries[idx].text = text;
      if (currentPrompt) entries[idx].prompt = currentPrompt;
      entries[idx].editedAt = new Date().toISOString();
      savedEntry = entries[idx];
      toast('已更新 ✦ 星辰被重新点亮');
    }
  } else {
    const newEntry = {
      id: Date.now(), text,
      prompt: currentPrompt || null,
      date: new Date().toISOString(),
    };
    entries.unshift(newEntry);
    savedEntry = newEntry;
    toast('已保存 ✦ 它已经变成一颗星');
  }

  saveEntries(entries);
  if (savedEntry) cloudSync('upsert', savedEntry);
  clearWrite();
  initStars();
}

function renderGarden(filter) {
  const entries = getEntries();
  const list = document.getElementById('gardenList');
  const empty = document.getElementById('gardenEmpty');
  const searchResult = document.getElementById('searchResult');
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');

  if (entries.length === 0) {
    document.getElementById('searchBox').style.display = 'none';
    list.style.display = 'none';
    empty.style.display = 'block';
    searchResult.style.display = 'none';
    return;
  }
  document.getElementById('searchBox').style.display = 'block';
  list.style.display = 'flex';
  empty.style.display = 'none';

  let sorted = [...entries].reverse(); // oldest → newest

  // Filter if search term provided
  if (filter && filter.trim()) {
    const q = filter.trim().toLowerCase();
    sorted = sorted.filter(e => {
      if (e.text.toLowerCase().includes(q)) return true;
      if (e.prompt && e.prompt.toLowerCase().includes(q)) return true;
      if (e.thread) {
        return e.thread.some(m => m.text.toLowerCase().includes(q));
      }
      return false;
    });
    searchResult.style.display = 'block';
    const isZh = L === 'zh';
    if (sorted.length === 0) {
      searchResult.textContent = isZh ? '没有匹配的星辰' : 'No matching stars';
    } else {
      searchResult.textContent = (isZh ? '找到 ' : 'Found ') + sorted.length + (isZh ? ' 颗星' : ' stars');
    }
  } else {
    searchResult.style.display = 'none';
  }

  if (searchInput) {
    searchClear.style.display = (filter && filter.trim()) ? 'block' : 'none';
  }

  list.innerHTML = sorted.map((e, i) => {
    const d = new Date(e.date);
    const dateStr = d.toLocaleDateString('zh-CN', {
      year: 'numeric', month: 'long', day: 'numeric'
    });
    const timeStr = d.toLocaleTimeString('zh-CN', {
      hour: '2-digit', minute: '2-digit'
    });
    const threadInfo = e.thread && e.thread.length > 0
      ? '<span style="color:rgba(140,200,160,0.5);">💬 ' + Math.floor(e.thread.length / 2) + ' 轮对话</span>'
      : '';
    const editedMark = e.editedAt
      ? '<span style="color:rgba(200,200,220,0.2);">（已编辑）</span>'
      : '';

    return '<div class="garden-card" onclick="openStarInWriter(' + e.id + ')">'
