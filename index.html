<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思·在 — 哲学思辨花园</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: rgba(20,20,40,0.7);
    --text: #c8c8d4;
    --text-bright: #e8e8f0;
    --accent: #d4a854;
    --accent-dim: rgba(212,168,84,0.15);
    --accent-glow: rgba(212,168,84,0.3);
    --border: rgba(255,255,255,0.06);
    --radius: 16px;
    --font-cn: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "KaiTi", "STSong", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.7;
  }

  #starfield {
    position: fixed; top:0; left:0; width:100%; height:100%;
    z-index: 0; pointer-events: none;
  }

  #app {
    position: relative; z-index: 1;
    max-width: 720px; margin: 0 auto;
    padding: 32px 20px 80px;
  }

  header {
    text-align: center; padding: 48px 0 32px;
  }
  header h1 {
    font-family: var(--font-cn);
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 700;
    color: var(--text-bright);
    letter-spacing: 0.08em;
    background: linear-gradient(135deg, #e8e8f0 0%, #d4a854 60%, #c8a048 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header .subtitle {
    margin-top: 8px;
    font-size: 0.9rem;
    color: rgba(200,200,220,0.5);
    letter-spacing: 0.15em;
    font-family: var(--font-cn);
  }
  .api-status {
    display: inline-block;
    margin-top: 10px;
    font-size: 0.7rem;
    padding: 4px 12px;
    border-radius: 12px;
    letter-spacing: 0.06em;
  }
  .api-status.online {
    background: rgba(100,200,120,0.12);
    color: rgba(140,220,160,0.8);
  }
  .api-status.offline {
    background: rgba(200,200,200,0.06);
    color: rgba(200,200,220,0.35);
  }

  nav {
    display: flex; justify-content: center; gap: 4px;
    margin-bottom: 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 40px; padding: 4px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  nav button {
    flex: 1; padding: 10px 16px;
    border: none; border-radius: 36px;
    background: transparent;
    color: rgba(200,200,220,0.55);
    font-size: 0.85rem; cursor: pointer;
    transition: all 0.3s ease;
    font-family: var(--font-cn);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  nav button.active {
    background: var(--accent-dim);
    color: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
  }
  nav button:hover:not(.active) {
    color: rgba(200,200,220,0.8);
  }

  .panel {
    display: none;
    animation: fadeUp 0.5s ease;
  }
  .panel.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    margin-bottom: 20px;
  }

  .question-block {
    text-align: center; padding: 40px 20px;
  }
  .question-label {
    font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-bottom: 20px;
    font-family: var(--font-sans);
  }
  .question-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 0.65rem;
    margin-left: 8px;
    letter-spacing: 0.06em;
    background: var(--accent-dim);
    color: var(--accent);
    vertical-align: middle;
  }
  .question-text {
    font-family: var(--font-cn);
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    color: var(--text-bright);
    line-height: 1.8;
    margin-bottom: 8px;
    transition: opacity 0.4s ease;
  }
  .question-source {
    font-size: 0.8rem;
    color: rgba(200,200,220,0.35);
    margin-top: 16px;
  }
  .question-actions {
    display: flex; gap: 12px; justify-content: center;
    margin-top: 28px; flex-wrap: wrap;
  }
  .btn {
    padding: 10px 24px;
    border-radius: 24px; border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.25s ease;
    font-family: var(--font-cn);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 24px var(--accent-glow);
  }
  .btn.primary {
    background: var(--accent-dim);
    border-color: rgba(212,168,84,0.3);
    color: var(--accent);
  }
  .btn.primary:hover {
    background: rgba(212,168,84,0.25);
  }
  .btn:disabled {
    opacity: 0.4; cursor: not-allowed; pointer-events: none;
  }

  .write-area {
    width: 100%; min-height: 260px;
    background: rgba(10,10,20,0.5);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    color: var(--text);
    font-family: var(--font-cn);
    font-size: 1rem;
    line-height: 1.9;
    resize: vertical;
    outline: none;
    transition: border-color 0.3s;
  }
  .write-area:focus {
    border-color: rgba(212,168,84,0.4);
    box-shadow: 0 0 30px rgba(212,168,84,0.08);
  }
  .write-area::placeholder {
    color: rgba(200,200,220,0.2);
  }
  .write-meta {
    display: flex; gap: 12px; align-items: center;
    margin-top: 12px; flex-wrap: wrap;
    font-size: 0.8rem; color: rgba(200,200,220,0.4);
  }
  .write-meta .prompt-ref {
    color: var(--accent);
    font-style: italic;
  }
  .char-count { margin-left: auto; }

  /* ── Constellation / Garden ── */
  .constellation-container {
    position: relative;
    width: 100%;
    min-height: 520px;
    border-radius: var(--radius);
    background: rgba(8,8,18,0.5);
    border: 1px solid var(--border);
    cursor: default;
  }
  .constellation-canvas {
    position: absolute; top:0; left:0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .entry-star {
    position: absolute;
    z-index: 1;
    cursor: pointer;
    /* Large invisible hit area so hover doesn't flicker */
    width: 80px; height: 80px;
    margin-left: -40px; margin-top: -40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: filter 0.3s ease;
  }
  .entry-star:hover {
    filter: brightness(1.6);
    z-index: 10;
  }
  .entry-star.show-tooltip {
    filter: brightness(1.6);
    z-index: 10;
  }
  .entry-star .star-core {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle, #f0d080 0%, #d4a854 40%, rgba(212,168,84,0.2) 70%, transparent 100%);
    box-shadow: 0 0 16px rgba(212,168,84,0.6), 0 0 40px rgba(212,168,84,0.2), 0 0 80px rgba(212,168,84,0.08);
    flex-shrink: 0;
    position: relative;
    pointer-events: none;
  }
  .entry-star.large .star-core {
    width: 22px; height: 22px;
    box-shadow: 0 0 24px rgba(212,168,84,0.8), 0 0 56px rgba(212,168,84,0.3), 0 0 100px rgba(212,168,84,0.12);
  }
  .entry-star.small .star-core {
    width: 10px; height: 10px;
    box-shadow: 0 0 10px rgba(212,168,84,0.4), 0 0 24px rgba(212,168,84,0.12);
  }
  .entry-star .star-halo {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(212,168,84,0.12);
    pointer-events: none;
    animation: haloPulse 3s ease-in-out infinite;
  }
  .entry-star.large .star-halo { width: 56px; height: 56px; }
  .entry-star.small .star-halo { width: 28px; height: 28px; }
  @keyframes haloPulse {
    0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.5); }
  }
  .entry-star .star-label {
    text-align: center;
    margin-top: 8px;
    font-size: 0.65rem;
    color: rgba(200,200,220,0.4);
    letter-spacing: 0.04em;
    white-space: nowrap;
    transition: color 0.3s;
    pointer-events: none;
  }
  .entry-star.show-tooltip .star-label {
    color: rgba(212,168,84,0.9);
  }
  .entry-star.show-tooltip .delete-star {
    display: block;
  }
  .entry-star .delete-star {
    display: none;
    position: absolute;
    top: -6px; right: -6px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(30,30,50,0.9);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(200,200,220,0.5);
    font-size: 0.6rem;
    cursor: pointer;
    line-height: 16px;
    text-align: center;
    z-index: 15;
  }
  .entry-star .delete-star:hover {
    color: #e06060;
    border-color: rgba(224,96,96,0.4);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: rgba(200,200,220,0.25);
    font-family: var(--font-cn);
    font-size: 1rem;
    line-height: 2;
  }

  .music-form {
    display: flex; flex-direction: column; gap: 14px;
  }
  .music-form input, .music-form textarea {
    width: 100%;
    background: rgba(10,10,20,0.5);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-family: var(--font-cn);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.3s;
  }
  .music-form input:focus, .music-form textarea:focus {
    border-color: rgba(212,168,84,0.4);
  }
  .music-form textarea { min-height: 80px; resize: vertical; }
  .music-list {
    margin-top: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .music-entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex; gap: 16px; align-items: flex-start;
    transition: all 0.2s;
  }
  .music-entry:hover { border-color: rgba(212,168,84,0.2); }
  .music-entry .album-art {
    width: 48px; height: 48px;
    border-radius: 8px;
    background: linear-gradient(135deg, #2a2a3a, #1a1a2a);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; flex-shrink: 0;
  }
  .music-entry .info { flex:1; min-width:0; }
  .music-entry .song-name {
    font-weight: 600; color: var(--text-bright);
    font-size: 0.95rem;
  }
  .music-entry .artist {
    font-size: 0.8rem; color: rgba(200,200,220,0.45);
    margin-top: 2px;
  }
  .music-entry .feeling {
    font-size: 0.85rem; color: var(--text);
    margin-top: 6px; line-height: 1.5;
  }
  .music-entry .m-date {
    font-size: 0.7rem; color: rgba(200,200,220,0.25);
    margin-top: 4px;
  }

  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: rgba(30,30,50,0.9);
    border: 1px solid var(--border);
    color: var(--text-bright);
    padding: 10px 24px;
    border-radius: 24px;
    font-size: 0.85rem;
    z-index: 100;
    animation: toastIn 0.3s ease, toastOut 0.3s ease 1.8s forwards;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    pointer-events: none;
  }
  @keyframes toastIn  { from { opacity:0; transform:translateX(-50%) translateY(10px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
  @keyframes toastOut { from { opacity:1; } to { opacity:0; } }

  .modal-overlay {
    position: fixed; inset:0; z-index:50;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: fadeInMod 0.2s ease;
  }
  @keyframes fadeInMod { from{opacity:0} to{opacity:1} }
  .modal {
    background: #141422;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    max-width: 600px; width: 90vw; max-height: 80vh;
    overflow-y: auto;
    font-family: var(--font-cn);
    line-height: 1.8;
    color: var(--text);
  }
  .modal .m-date { font-size:0.75rem; color:rgba(200,200,220,0.3); }
  .modal .m-body { margin-top:16px; white-space: pre-wrap; }
  .modal .close-btn {
    margin-top:20px;
    padding:8px 20px;
    border-radius:20px; border:1px solid var(--border);
    background:transparent; color:var(--text); cursor:pointer;
    font-family:var(--font-cn);
  }

  /* ── Global Tooltip (detached from star DOM, no flicker) ── */
  .global-tooltip {
    position: fixed;
    pointer-events: none;
    z-index: 200;
    background: rgba(20,18,35,0.96);
    border: 1px solid rgba(212,168,84,0.25);
    border-radius: 12px;
    padding: 12px 16px;
    width: 260px;
    text-align: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.18s ease, visibility 0.18s ease;
  }
  .global-tooltip.visible {
    opacity: 1;
    visibility: visible;
  }
  .global-tooltip .t-date {
    font-size: 0.65rem;
    color: rgba(200,200,220,0.4);
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .global-tooltip .t-question {
    font-family: var(--font-cn);
    font-size: 0.82rem;
    color: var(--accent);
    line-height: 1.5;
    font-style: italic;
  }
  .global-tooltip .t-preview {
    font-family: var(--font-cn);
    font-size: 0.75rem;
    color: rgba(200,200,220,0.6);
    line-height: 1.5;
    margin-top: 4px;
  }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(212,168,84,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 500px) {
    #app { padding: 16px 12px 60px; }
    .card { padding: 20px 16px; }
    nav button { font-size: 0.75rem; padding: 8px 10px; }
    .constellation-container { min-height: 380px; }
  }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="思在">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' rx='36' fill='%230a0a0f'/><text x='90' y='115' text-anchor='middle' font-size='100' font-family='serif'>🌿</text></svg>">
</head>
<body>

<canvas id="starfield"></canvas>

<div id="app">
  <header>
    <h1>思·在</h1>
    <div class="subtitle">THINKING · BEING</div>
    <div class="api-status offline" id="apiStatus">本地题库</div>
  </header>

  <nav>
    <button data-panel="question" class="active">🜁 每日一问</button>
    <button data-panel="write">✎ 书写</button>
    <button data-panel="garden">✦ 思之星辰</button>
    <button data-panel="dialogue">↗ 对话</button>
    <button data-panel="music">♪ 音乐</button>
  </nav>

  <!-- QUESTION PANEL -->
  <section class="panel active" id="panel-question">
    <div class="card question-block">
      <div class="question-label" id="questionLabel">今日之问</div>
      <div class="question-text" id="questionText"></div>
      <div class="question-source" id="questionSource"></div>
      <div class="question-actions">
        <button class="btn" id="btnRefresh" onclick="refreshQuestion()">↻ 换一个问题</button>
        <button class="btn" id="btnAI" onclick="fetchAIQuestion()" style="position:relative;">
          ✦ AI 生成
        </button>
        <button class="btn primary" onclick="goWriteWithQuestion()">✎ 回应这个问题</button>
      </div>
    </div>
  </section>

  <!-- WRITE PANEL -->
  <section class="panel" id="panel-write">
    <div class="card">
      <div class="write-meta" id="writeMeta" style="margin-top:0; margin-bottom:12px;"></div>
      <textarea class="write-area" id="writeArea"
        placeholder="此刻，你在想什么？…"
      ></textarea>
      <div class="write-meta">
        <span class="prompt-ref" id="promptRef"></span>
        <span class="char-count" id="charCount">0 字</span>
      </div>
      <div style="margin-top:16px; display:flex; gap:12px; flex-wrap:wrap;">
        <button class="btn primary" onclick="saveEntry()">✦ 保存为星辰</button>
        <button class="btn" onclick="sendToClaude()" id="btnSend" style="border-color:rgba(180,200,220,0.3);">↗ 与 Claude 思辨</button>
        <button class="btn" onclick="clearWrite()">清空</button>
      </div>
    </div>
  </section>

  <!-- GARDEN PANEL — Constellation -->
  <section class="panel" id="panel-garden">
    <div class="constellation-container" id="constellation">
      <canvas class="constellation-canvas" id="constellationCanvas"></canvas>
    </div>
    <div class="empty-state" id="gardenEmpty">
      还没有文字。<br>去「书写」那里留下你的第一个想法吧。
    </div>
  </section>

  <!-- DIALOGUE PANEL -->
  <section class="panel" id="panel-dialogue">
    <div class="card" style="text-align:center; padding: 32px 20px;">
      <p style="font-family:var(--font-cn); color:var(--text-bright); font-size:1.05rem; line-height:1.8;">
        把你的思辨文字<br>发送给 <span style="color:var(--accent);">Claude</span>，一起探讨。
      </p>
      <p style="font-size:0.8rem; color:rgba(200,200,220,0.4); margin-top:12px; line-height:1.6;" id="dialogueStatus">
        服务器未连接 · 将使用剪贴板模式
      </p>
    </div>

    <!-- Unsent queue -->
    <div class="card" id="queueCard" style="display:none;">
      <div style="font-size:0.8rem; color:var(--accent); margin-bottom:12px; letter-spacing:0.06em;">
        ⬡ 待发送的思辨
      </div>
      <div id="queueList"></div>
    </div>

    <!-- Inbox preview (when server connected) -->
    <div class="card" id="inboxCard" style="display:none;">
      <div style="font-size:0.8rem; color:rgba(200,200,220,0.5); margin-bottom:12px; letter-spacing:0.06em;">
        ↖ 已发送的思辨
      </div>
      <div id="inboxList"></div>
    </div>

    <div class="empty-state" id="dialogueEmpty">
      还没有发送过思辨文字。<br>去「书写」那里，写下你的想法，<br>然后点击「与 Claude 思辨」。
    </div>
  </section>

  <!-- MUSIC PANEL -->
  <section class="panel" id="panel-music">
    <div class="card">
      <div class="music-form">
        <input type="text" id="songName" placeholder="歌曲名">
        <input type="text" id="artistName" placeholder="艺术家 / 音乐人">
        <textarea id="musicFeeling" placeholder="这首歌让你想到了什么？它带给你什么样的感受？"></textarea>
        <button class="btn primary" onclick="saveMusic()" style="align-self:flex-start;">♫ 记录此刻的聆听</button>
      </div>
    </div>
    <div class="music-list" id="musicList"></div>
  </section>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal(event)">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- GLOBAL TOOLTIP for constellation stars (detached from star DOM) -->
  <div class="global-tooltip" id="globalTooltip">
    <div class="t-date" id="gtDate"></div>
    <div class="t-question" id="gtQuestion"></div>
    <div class="t-preview" id="gtPreview"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
//  CONFIGURATION
// ═══════════════════════════════════════
// 部署后把下面这行改成你的 Render URL，例如：
// const API_BASE = 'https://sizai-xxxx.onrender.com';
const API_BASE = 'http://localhost:8899';

// ═══════════════════════════════════════
//  STARFIELD
// ═══════════════════════════════════════
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
let w, h;

function resizeCanvas() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); initStars(); });

function initStars() {
  const count = Math.floor((w * h) / 3000);
  stars = [];
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.2 + 0.3,
      a: Math.random(),
      speed: Math.random() * 0.008 + 0.003,
      phase: Math.random() * Math.PI * 2
    });
  }
  const entries = getEntries();
  entries.forEach((entry, i) => {
    const angle = (i / Math.max(entries.length, 1)) * Math.PI * 2;
    const radius = Math.min(w, h) * 0.25;
    stars.push({
      x: w/2 + Math.cos(angle) * radius * (0.4 + Math.random() * 0.6),
      y: h/2 + Math.sin(angle) * radius * (0.4 + Math.random() * 0.6),
      r: 1.5 + Math.random() * 1.5,
      a: 0.7 + Math.random() * 0.3,
      speed: 0.015 + Math.random() * 0.02,
      phase: Math.random() * Math.PI * 2,
      isEntry: true
    });
  });
}

function drawStars() {
  ctx.clearRect(0, 0, w, h);
  const t = Date.now() / 1000;
  for (const s of stars) {
    const alpha = s.a * (0.5 + 0.5 * Math.sin(t * s.speed * 3 + s.phase));
    if (s.isEntry) {
      ctx.fillStyle = `rgba(212,168,84,${alpha * 0.8})`;
      ctx.shadowColor = `rgba(212,168,84,${alpha * 0.5})`;
      ctx.shadowBlur = 6;
    } else {
      ctx.fillStyle = `rgba(200,210,240,${alpha})`;
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
    }
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  requestAnimationFrame(drawStars);
}

initStars();
drawStars();

//  QUESTION ENGINE

let apiOnline = false;
let currentQuestion = null;

function getDailySeed() {
  const today = new Date().toISOString().slice(0, 10);
  let hash = 0;
  for (let i = 0; i < today.length; i++) {
    hash = ((hash << 5) - hash) + today.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function getDailyQuestion() {
  const today = new Date().toISOString().slice(0, 10);
  // Check if we already have today's question cached
  const stored = localStorage.getItem('sizai_daily');
  if (stored) {
    try {
      const data = JSON.parse(stored);
      if (data.date === today && data.q) return data;
    } catch(e) {}
  }
  // Deterministic daily pick from the bank
  const seed = getDailySeed();
  const idx = seed % QUESTION_BANK.length;
  const picked = { date: today, index: idx, ...QUESTION_BANK[idx], source: 'bank' };
  localStorage.setItem('sizai_daily', JSON.stringify(picked));
  return picked;
}

function pickRandomQuestion() {
  // Avoid repeating the last few shown questions
  const recent = JSON.parse(localStorage.getItem('sizai_recent') || '[]');
  let available = QUESTION_BANK.filter((_, i) => !recent.includes(i));
  if (available.length === 0) {
    available = QUESTION_BANK;
    recent.length = 0;
  }
  const idx = QUESTION_BANK.indexOf(available[Math.floor(Math.random() * available.length)]);
  // Keep track of last 30 shown to minimize repeats
  recent.push(idx);
  if (recent.length > 30) recent.shift();
  localStorage.setItem('sizai_recent', JSON.stringify(recent));
  return { ...QUESTION_BANK[idx], source: 'bank' };
}

function displayQuestion(data) {
  if (!data) data = getDailyQuestion();
  currentQuestion = data;
  document.getElementById('questionText').textContent = data.q;
  document.getElementById('questionSource').textContent = data.src;
  if (data.source === 'ai') {
    document.getElementById('questionLabel').innerHTML = 'AI 之问 <span class="question-badge">实时生成</span>';
  } else {
    document.getElementById('questionLabel').textContent = '今日之问';
  }
}

async function refreshQuestion() {
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  btn.textContent = '…';

  // Try AI first if online
  if (apiOnline) {
    try {
      const q = await fetchFromAPI();
      if (q) {
        currentQuestion = { ...q, source: 'ai' };
        displayQuestion(currentQuestion);
        btn.disabled = false;
        btn.textContent = '↻ 换一个问题';
        return;
      }
    } catch(e) {}
  }

  // Fall back to bank
  const q = pickRandomQuestion();
  currentQuestion = q;
  displayQuestion(q);
  btn.disabled = false;
  btn.textContent = '↻ 换一个问题';
}

async function fetchAIQuestion() {
  const btn = document.getElementById('btnAI');
  btn.disabled = true;
  const origText = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span> 生成中…';

  try {
    const q = await fetchFromAPI();
    if (q) {
      currentQuestion = { ...q, source: 'ai' };
      displayQuestion(currentQuestion);
      toast('✦ AI 生成的全新问题');
    }
  } catch(e) {
    // Fall back to bank
    const q = pickRandomQuestion();
    currentQuestion = q;
    displayQuestion(q);
    if (!apiOnline) {
      toast('AI 服务器未连接，使用本地题库');
    } else {
      toast('生成失败，使用本地题库');
    }
  }

  btn.disabled = false;
  btn.innerHTML = origText;
}

async function fetchFromAPI() {
  const resp = await fetch(`${API_BASE}/api/question`, {
    signal: AbortSignal.timeout(8000)
  });
  if (!resp.ok) throw new Error('API error');
  const data = await resp.json();
  if (data.error) throw new Error(data.error);
  return { ...data, source: 'ai' };
}

async function checkAPIStatus() {
  try {
    const resp = await fetch(`${API_BASE}/api/ping`, {
      signal: AbortSignal.timeout(3000)
    });
    const data = await resp.json();
    if (data.ok) {
      apiOnline = true;
      const hasKey = data.has_api_key;
      document.getElementById('apiStatus').textContent = hasKey ? 'AI 实时生成 · 已连接' : '服务器已连接 · 本地题库';
      document.getElementById('apiStatus').className = 'api-status online';
      document.getElementById('btnAI').style.display = hasKey ? '' : '';
      updateDialogueStatus();
      return;
    }
  } catch(e) {}
  apiOnline = false;
  document.getElementById('apiStatus').textContent = '本地题库 · 170+ 问题';
  document.getElementById('apiStatus').className = 'api-status offline';
  document.getElementById('btnAI').style.display = '';
  updateDialogueStatus();
}

function updateDialogueStatus() {
  const el = document.getElementById('dialogueStatus');
  if (!el) return;
  if (apiOnline) {
    el.innerHTML = '<span style="color:rgba(140,220,160,0.8);">●</span> 服务器已连接 · 文字直达 Claude';
  } else {
    el.innerHTML = '<span style="color:rgba(200,200,200,0.4);">○</span> 离线模式 · 剪贴板发送<br><span style="font-size:0.7rem;">启动直达: <code style="background:rgba(255,255,255,0.04);padding:2px 6px;border-radius:4px;">cd /Users/a/sizai && python3 server.py</code></span>';
  }
}

let currentPrompt = '';

function goWriteWithQuestion() {

function clearWrite() {
  document.getElementById('writeArea').value = '';

  document.getElementById('promptRef').textContent = '';

}

function updateCharCount() {
  const len = document.getElementById('writeArea').value.length;
  document.getElementById('charCount').textContent = len + ' 字';
}

document.getElementById('writeArea').addEventListener('input', updateCharCount);

function saveEntry() {
  const text = document.getElementById('writeArea').value.trim();
  if (!text) { toast('先写点什么吧'); return; }
  const entries = getEntries();

  if (editingId) {
    // 编辑模式：更新已有条目
    const idx = entries.findIndex(e => e.id === editingId);
    if (idx >= 0) {
      entries[idx].text = text;
      if (currentPrompt) entries[idx].prompt = currentPrompt;
      entries[idx].editedAt = new Date().toISOString();
      toast('已更新 ✦ 星辰被重新点亮');
    }
  } else {
    // 新建模式
    entries.unshift({
      id: Date.now(),
      text,
      prompt: currentPrompt || null,
      date: new Date().toISOString(),
    });
    toast('已保存 ✦ 它已经变成一颗星');
  }

  localStorage.setItem('sizai_entries', JSON.stringify(entries));
  clearWrite();
  initStars();
}

function getEntries() {
  try { return JSON.parse(localStorage.getItem('sizai_entries')) || []; }
  catch(e) { return []; }
}

function deleteEntry(id) {
  let entries = getEntries();
  entries = entries.filter(e => e.id !== id);
  localStorage.setItem('sizai_entries', JSON.stringify(entries));
  renderGarden();
  initStars();
  toast('已删除');
}

function renderGarden() {
  const entries = getEntries();
  const container = document.getElementById('constellation');
  const canvas = document.getElementById('constellationCanvas');
  const empty = document.getElementById('gardenEmpty');

  // Remove old star elements
  container.querySelectorAll('.entry-star').forEach(el => el.remove());

  if (entries.length === 0) {
    container.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  container.style.display = 'block';
  empty.style.display = 'none';

  // Sort oldest → newest
  const sorted = [...entries].reverse();

  // ── Layout algorithm: timeline constellation ──
  const pad = 50; // padding from edges
  const w = container.clientWidth;
  const h = container.clientHeight || 520;

  // Resize canvas
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  // Calculate positions
  const points = sorted.map((e, i) => {
    const t = sorted.length === 1 ? 0.5 : i / (sorted.length - 1);
    // x: left → right (old → new)
    const x = pad + t * (w - pad * 2);
    // y: organic wave pattern, with time-of-day influence
    const d = new Date(e.date);
    const hourFrac = d.getHours() / 24;
    const wave = Math.sin(t * Math.PI * 2.5 + i * 0.7) * (h * 0.18);
    const timeBias = (hourFrac - 0.5) * (h * 0.25);
    const y = h / 2 + wave + timeBias;
    // Clamp to container
    const cy = Math.max(pad, Math.min(h - pad, y));

    // Size by entry length
    const len = e.text.length;
    let sizeClass = '';
    if (len > 800) sizeClass = 'large';
    else if (len < 150) sizeClass = 'small';

    return { x, y: cy, entry: e, sizeClass };
  });

  // ── Draw constellation lines ──
  ctx.clearRect(0, 0, w, h);
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i];
    const b = points[i + 1];
    const alpha = 0.12 + 0.08 * (i / points.length);
    ctx.strokeStyle = `rgba(212,168,84,${alpha})`;
    ctx.lineWidth = 0.6;
    ctx.setLineDash([3, 6]);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    // Gentle curve connecting stars
    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2 - 15;
    ctx.quadraticCurveTo(mx, my, b.x, b.y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Draw subtle background grid stars
  for (let i = 0; i < 40; i++) {
    const bx = Math.random() * w;
    const by = Math.random() * h;
    const br = Math.random() * 0.8 + 0.2;
    ctx.fillStyle = `rgba(200,210,240,${Math.random() * 0.2 + 0.05})`;
    ctx.beginPath();
    ctx.arc(bx, by, br, 0, Math.PI * 2);
    ctx.fill();
  }

  // ── Create star DOM elements ──
  const fragment = document.createDocumentFragment();
  points.forEach((p) => {
    const e = p.entry;
    const date = new Date(e.date);
    const dateStr = date.toLocaleDateString('zh-CN', {
      month: 'short', day: 'numeric'
    });
    const timeStr = date.toLocaleTimeString('zh-CN', {
      hour: '2-digit', minute: '2-digit'
    });
    const fullDateStr = date.toLocaleDateString('zh-CN', {
      year: 'numeric', month: 'long', day: 'numeric'
    });
    const preview = e.text.slice(0, 60);

    const star = document.createElement('div');
    star.className = 'entry-star ' + p.sizeClass;
    star.style.left = p.x + 'px';
    star.style.top = p.y + 'px';
    star.onclick = () => openEntry(e.id);

    // Stable tooltip via global detached element (no DOM nesting flicker)
    let hideTimer;
    star.addEventListener('mouseenter', (ev) => {
      clearTimeout(hideTimer);
      star.classList.add('show-tooltip');
      // Populate and position global tooltip
      const gt = document.getElementById('globalTooltip');
      document.getElementById('gtDate').textContent = fullDateStr + ' · ' + timeStr;
      document.getElementById('gtQuestion').innerHTML = e.prompt
        ? '「' + escapeHtml(e.prompt.slice(0, 80)) + '」'
        : '';
      document.getElementById('gtPreview').textContent = preview ? preview + '…' : '';
      gt.classList.add('visible');
      positionTooltip(gt, star);
    });
    star.addEventListener('mouseleave', () => {
      hideTimer = setTimeout(() => {
        star.classList.remove('show-tooltip');
        document.getElementById('globalTooltip').classList.remove('visible');
      }, 150);
    });

    star.innerHTML = `
      <div class="star-core"></div>
      <div class="star-halo"></div>
      <button class="delete-star" onclick="event.stopPropagation();deleteEntry(${e.id})">×</button>
      <div class="star-label">${dateStr}</div>
    `;
    fragment.appendChild(star);
  });
  container.appendChild(fragment);

  // ── Observe resize (debounced to prevent loops) ──
  if (container._ro) container._ro.disconnect();
  let resizeTimer;
  const ro = new ResizeObserver(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => renderGarden(), 150);
  });
  ro.observe(container);
  container._ro = ro;
}

function openEntry(id) {
  const entries = getEntries();
  const e = entries.find(en => en.id === id);
  if (!e) return;
  const date = new Date(e.date).toLocaleDateString('zh-CN', {
    year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
  });
  const editedNote = e.editedAt
    ? '<div class="m-date" style="margin-bottom:8px;">（已编辑）</div>'
    : '';

  let bodyHTML = `<div class="m-date">${date}</div>${editedNote}`;

  if (e.prompt) {
    bodyHTML += '<div style="color:var(--accent); margin-bottom:16px; font-style:italic; font-size:0.9rem; line-height:1.5;">「' + escapeHtml(e.prompt) + '」</div>';
  }

  if (e.thread && e.thread.length > 0) {
    // ── 对话线程视图 ──
    bodyHTML += '<div class="thread-view">';
    e.thread.forEach(msg => {
      const isUser = msg.role === 'user';
      const align = isUser ? 'text-align:right; margin-left:32px;' : 'text-align:left; margin-right:32px;';
      const bubble = isUser
        ? 'background:rgba(212,168,84,0.07); border:1px solid rgba(212,168,84,0.14);'
        : 'background:rgba(120,180,160,0.05); border:1px solid rgba(120,180,160,0.1);';
      const label = isUser ? '💭 你' : '🌿 Claude';
      const msgDate = new Date(msg.date).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
      bodyHTML += '<div style="' + align + ' margin-bottom:10px;">'
        + '<div style="font-size:0.6rem; color:rgba(200,200,220,0.3); margin-bottom:2px; letter-spacing:0.04em;">' + label + ' · ' + msgDate + '</div>'
        + '<div style="display:inline-block; ' + bubble + ' border-radius:12px; padding:10px 14px; font-size:0.86rem; line-height:1.7; text-align:left; word-break:break-word; max-width:100%;">' + escapeHtml(msg.text) + '</div>'
        + '</div>';
    });
    bodyHTML += '</div>';

    // 按钮行：电脑端显示「继续对话」输入框和发送，手机端只显示编辑和关闭
    if (apiOnline) {
      bodyHTML += '<div style="margin-top:16px; border-top:1px solid var(--border); padding-top:12px;">'
        + '<textarea id="threadInput" class="write-area" style="min-height:56px; font-size:0.85rem;" placeholder="继续这段对话…"></textarea>'
        + '<div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">'
        + '<button class="btn primary" onclick="sendThreadMessage(' + e.id + ')">↗ 发送</button>'
        + '<button class="btn" onclick="editEntry(' + e.id + ')">✎ 编辑文字</button>'
        + '<button class="close-btn" onclick="closeModal()" style="margin-left:auto;">关闭</button>'
        + '</div></div>';
    } else {
      bodyHTML += '<div style="margin-top:16px; border-top:1px solid var(--border); padding-top:12px; font-size:0.75rem; color:rgba(200,200,220,0.3); text-align:center;">在电脑上打开思在，连接 Claude 继续这段对话</div>'
        + '<div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">'
        + '<button class="btn" onclick="editEntry(' + e.id + ')">✎ 编辑</button>'
        + '<button class="close-btn" onclick="closeModal()" style="margin-left:auto;">关闭</button>'
        + '</div>';
    }
  } else {
    // ── 普通文字视图（无对话线程）──
    bodyHTML += '<div class="m-body">' + escapeHtml(e.text) + '</div>';
    bodyHTML += '<div style="display:flex; gap:8px; margin-top:20px; flex-wrap:wrap;">'
      + '<button class="btn" onclick="editEntry(' + e.id + ')">✎ 编辑</button>';
    if (apiOnline) {
      bodyHTML += '<button class="btn primary" onclick="sendEntryToClaude(' + e.id + ')">↗ 与 Claude 思辨</button>';
    }
    bodyHTML += '<button class="close-btn" onclick="closeModal()" style="margin-left:auto;">关闭</button>'
      + '</div>';
  }

  document.getElementById('modalContent').innerHTML = bodyHTML;
  document.getElementById('modalOverlay').style.display = 'flex';
}

function editEntry(id) {
  const entries = getEntries();
  const e = entries.find(en => en.id === id);
  if (!e) return;
  document.getElementById('modalOverlay').style.display = 'none';
  document.getElementById('writeArea').value = e.text;
  currentPrompt = e.prompt || '';
  editingId = id;
  if (currentPrompt) {
    document.getElementById('promptRef').textContent = '回应：「' + currentPrompt.slice(0, 40) + '…」';
  }
  document.getElementById('writeMeta').innerHTML =
    '<span style="color:var(--accent);">✦ 编辑模式</span>'
    + ' <span style="font-size:0.7rem;color:rgba(200,200,220,0.35);">修改后将更新这颗星辰</span>';
  document.querySelector('#panel-write .btn.primary').textContent = '✦ 更新星辰';
  switchPanel('write');
  updateCharCount();
  document.getElementById('writeArea').focus();
  document.getElementById('writeArea').setSelectionRange(e.text.length, e.text.length);
}

function sendEntryToClaude(id) {
  const entries = getEntries();
  const e = entries.find(en => en.id === id);
  if (!e) return;
  document.getElementById('modalOverlay').style.display = 'none';
  // 如果有线程，带上上一次的 prompt；否则用星辰自身的文字
  document.getElementById('writeArea').value = e.text;
  currentPrompt = e.prompt || '';
  editingId = id;  // 标记：回复会追加到这个星辰的线程里
  updateCharCount();
  document.getElementById('writeMeta').innerHTML =
    '<span style="color:var(--accent);">↗ 正在发送给 Claude…</span>';
  document.querySelector('#panel-write .btn.primary').textContent = '✦ 保存为星辰';
  switchPanel('write');
  sendToClaude();
}

// ═══════════════════════════════════════
//  DIALOGUE — Send to Claude
// ═══════════════════════════════════════
async function sendToClaude() {
  const text = document.getElementById('writeArea').value.trim();
  if (!text) { toast('先写点什么吧'); return; }

  const prompt = currentPrompt || '';
  const btn = document.getElementById('btnSend');
  const origHTML = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> 思考中…';
  btn.disabled = true;

  let reply = null;
  let sent = false;

  // Try server first (with AI reply)
  if (apiOnline) {
    try {
      btn.innerHTML = '<span class="spinner"></span> Claude 正在读你的文字…';
      const resp = await fetch(`${API_BASE}/api/submit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, prompt }),
        signal: AbortSignal.timeout(65000),
      });
      const data = await resp.json();
      if (data.ok) {
        sent = true;
        if (data.reply) reply = data.reply;
      }
    } catch(e) {
      if (e.name === 'TimeoutError') { sent = true; }
    }
  }

  if (!sent) {
    copyToClipboard(text, prompt);
  }

  // ── 自动保存为星辰（带对话线程）──
  const now = new Date().toISOString();
  const threadMsg = [{ role: 'user', text, date: now }];
  if (reply) {
    threadMsg.push({ role: 'claude', text: reply, date: now });
  }

  const entries = getEntries();
  if (editingId) {
    // 追加到已有星辰的线程
    const idx = entries.findIndex(e => e.id === editingId);
    if (idx >= 0) {
      if (!entries[idx].thread) {
        // 旧条目转线程格式
        entries[idx].thread = [
          { role: 'user', text: entries[idx].text, date: entries[idx].date }
        ];
      }
      entries[idx].thread.push(...threadMsg);
      entries[idx].text = text;
      entries[idx].editedAt = now;
    }
  } else {
    // 新建星辰
    entries.unshift({
      id: Date.now(),
      text,
      prompt: prompt || null,
      date: now,
      thread: threadMsg,
    });
  }
  localStorage.setItem('sizai_entries', JSON.stringify(entries));

  // 同步到对话面板队列
  const entryId = addToSentQueue(text, prompt);
  if (reply) markReplied(entryId, reply);

  clearWrite();
  initStars();
  renderDialogue();

  if (reply) {
    toast('已存为星辰 ✦ Claude 已回复');
  } else if (sent) {
    toast('已存为星辰 · 等待 Claude 回复');
  } else {
    toast('已存为星辰 · 在电脑上继续对话');
  }

  btn.innerHTML = origHTML;
  btn.disabled = false;
}

async function sendThreadMessage(id) {
  const input = document.getElementById('threadInput');
  if (!input) return;
  const newMsg = input.value.trim();
  if (!newMsg) { toast('写点什么吧'); return; }

  const entries = getEntries();
  const idx = entries.findIndex(e => e.id === id);
  if (idx < 0) return;
  const entry = entries[idx];
  if (!entry.thread) {
    entry.thread = [{ role: 'user', text: entry.text, date: entry.date }];
  }

  // 把新消息加入线程
  const now = new Date().toISOString();
  entry.thread.push({ role: 'user', text: newMsg, date: now });
  entry.text = newMsg;
  entry.editedAt = now;

  // 构建完整对话上下文发给 Claude
  let reply = null;
  if (apiOnline) {
    try {
      const context = entry.thread.map(m =>
        (m.role === 'user' ? '我：' : 'Claude：') + m.text
      ).join('\n\n');
      const resp = await fetch(`${API_BASE}/api/submit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: '以下是我和你的对话历史，请针对我最后一条消息继续回复：\n\n' + context,
          prompt: entry.prompt || ''
        }),
        signal: AbortSignal.timeout(65000),
      });
      const data = await resp.json();
      if (data.ok && data.reply) reply = data.reply;
    } catch(e) {}
  }

  if (reply) {
    entry.thread.push({ role: 'claude', text: reply, date: new Date().toISOString() });
  }

  localStorage.setItem('sizai_entries', JSON.stringify(entries));
  openEntry(id);  // 刷新弹窗

  if (reply) {
    toast('🌿 Claude 已回复');
  } else {
    toast('已发送 · 等待回复');
  }
}

function addToSentQueue(text, prompt) {
  const queue = JSON.parse(localStorage.getItem('sizai_dialogue') || '[]');
  const entry = {
    id: Date.now(),
    text,
    prompt,
    date: new Date().toISOString(),
    replied: false,
    replyText: null,
    replyDate: null,
  };
  queue.unshift(entry);
  if (queue.length > 50) queue.length = 50;
  localStorage.setItem('sizai_dialogue', JSON.stringify(queue));
  return entry.id;
}

function markReplied(entryId, replyText) {
  const queue = JSON.parse(localStorage.getItem('sizai_dialogue') || '[]');
  const entry = queue.find(e => e.id === entryId);
  if (entry) {
    entry.replied = true;
    entry.replyText = replyText;
    entry.replyDate = new Date().toISOString();
    localStorage.setItem('sizai_dialogue', JSON.stringify(queue));
  }
}

function copyToClipboard(text, prompt) {
  let msg = '';
  if (prompt) {
    msg += '我在「思·在」回应了这个问题：\n';
    msg += '> ' + prompt + '\n\n';
  }
  msg += text;
  msg += '\n\n———\n（来自 思·在 哲学思辨花园）';

  navigator.clipboard.writeText(msg).catch(() => {
    // Fallback: select from a temporary textarea
    const ta = document.createElement('textarea');
    ta.value = msg;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}

function getSentQueue() {
  try { return JSON.parse(localStorage.getItem('sizai_dialogue') || '[]'); }
  catch(e) { return []; }
}

async function renderDialogue() {
  const queue = getSentQueue();
  const empty = document.getElementById('dialogueEmpty');
  const queueCard = document.getElementById('queueCard');
  const queueList = document.getElementById('queueList');
  const inboxCard = document.getElementById('inboxCard');
  const inboxList = document.getElementById('inboxList');
  const statusEl = document.getElementById('dialogueStatus');

  if (apiOnline) {
    statusEl.innerHTML = '<span style="color:rgba(140,220,160,0.8);">●</span> 服务器已连接 · 文字直达 Claude';
  } else {
    statusEl.innerHTML = '<span style="color:rgba(200,200,200,0.4);">○</span> 离线模式 · 使用剪贴板发送<br><span style="font-size:0.7rem;">启动服务器: <code style="background:rgba(255,255,255,0.04);padding:2px 6px;border-radius:4px;">cd /Users/a/sizai && python3 server.py</code></span>';
  }

  // Fetch replies from server to check which items have been replied to
  let replies = [];
  if (apiOnline) {
    try {
      const resp = await fetch(`${API_BASE}/api/replies`, {
        signal: AbortSignal.timeout(3000)
      });
      replies = await resp.json();
    } catch(e) {}
  }

  // Mark items as replied if they match a reply
  if (replies.length > 0) {
    let changed = false;
    queue.forEach(item => {
      if (!item.replied) {
        const matched = replies.find(r =>
          r.reply_to && item.text.includes(r.reply_to.trim().slice(0, 20))
        );
        if (matched) {
          item.replied = true;
          item.replyText = matched.text;
          item.replyDate = matched.date;
          changed = true;
        }
      }
    });
    if (changed) {
      localStorage.setItem('sizai_dialogue', JSON.stringify(queue));
    }
  }

  if (queue.length === 0) {
    queueCard.style.display = 'none';
    inboxCard.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  queueCard.style.display = 'block';

  queueList.innerHTML = queue.map((item, i) => {
    const date = new Date(item.date);
    const dateStr = date.toLocaleDateString('zh-CN', {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
    const preview = item.text.slice(0, 80);

    let replyBlock = '';
    if (item.replied && item.replyText) {
      replyBlock = `
        <div style="margin-top:10px; padding:10px 14px; background:rgba(100,180,140,0.06); border-left:2px solid rgba(140,220,160,0.3); border-radius:4px;">
          <div style="font-size:0.65rem; color:rgba(140,220,160,0.5); margin-bottom:4px;">↩ Claude 的回复</div>
          <div style="font-size:0.82rem; color:rgba(200,220,210,0.85); line-height:1.6;">${escapeHtml(item.replyText.slice(0, 200))}</div>
        </div>`;
    }

    const repliedBadge = item.replied
      ? '<span style="color:rgba(140,220,160,0.6); font-size:0.65rem;">✓ Claude 已回复</span>'
      : '<span style="color:var(--accent); font-size:0.65rem;">⏳ 等待 Claude…</span>';

    return `
      <div style="padding:14px 0; border-bottom:1px solid var(--border); ${i === 0 ? 'border-top:1px solid var(--border);' : ''}">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <span style="font-size:0.7rem; color:rgba(200,200,220,0.35);">${dateStr}</span>
          ${repliedBadge}
        </div>
        ${item.prompt ? '<div style="font-size:0.75rem; color:var(--accent); font-style:italic; margin-bottom:4px;">「' + escapeHtml(item.prompt.slice(0, 60)) + '」</div>' : ''}
        <div style="font-size:0.85rem; color:var(--text); line-height:1.5;">${escapeHtml(preview)}…</div>
        ${replyBlock}
      </div>
    `;
  }).join('');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').style.display = 'none';
}

function getMusicEntries() {
  try { return JSON.parse(localStorage.getItem('sizai_music')) || []; }

function saveMusic() {
  const name = document.getElementById('songName').value.trim();
  const artist = document.getElementById('artistName').value.trim();
  const feeling = document.getElementById('musicFeeling').value.trim();
  if (!name) { toast('至少填一下歌名吧'); return; }

  const entries = getMusicEntries();
  entries.unshift({
    id: Date.now(),
    name, artist: artist || '未知', feeling,
    date: new Date().toISOString(),
  });
  localStorage.setItem('sizai_music', JSON.stringify(entries));
  document.getElementById('songName').value = '';
  document.getElementById('artistName').value = '';
  document.getElementById('musicFeeling').value = '';
  renderMusic();
  toast('♫ 已记录');

function deleteMusic(id) {
  let entries = getMusicEntries();
  entries = entries.filter(e => e.id !== id);
  localStorage.setItem('sizai_music', JSON.stringify(entries));
  renderMusic();
}

function renderMusic() {
  const entries = getMusicEntries();
  const list = document.getElementById('musicList');
  if (entries.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:30px;">还没有记录音乐。<br>听到触动你的歌时，来这里记下。</div>';
    return;
  }
  list.innerHTML = entries.map(e => {
    const date = new Date(e.date).toLocaleDateString('zh-CN', {

      <div class="music-entry">
        <div class="album-art">♪</div>

  }).join('');
}

// ═══════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function toast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

// Position the global tooltip near a star element
function positionTooltip(tooltip, star) {
  const starRect = star.getBoundingClientRect();
  const ttRect = tooltip.getBoundingClientRect();
  const gap = 20;

  // Place above the star by default
  let top = starRect.top - ttRect.height - gap;
  let left = starRect.left + starRect.width / 2 - ttRect.width / 2;

  // If too close to top edge, place below
  if (top < 10) {
    top = starRect.bottom + gap;
  }

  // Keep within horizontal viewport
  if (left < 10) left = 10;
  if (left + ttRect.width > window.innerWidth - 10) {
    left = window.innerWidth - ttRect.width - 10;
  }

  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}
