services:
  - type: web
    name: sizai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: GIST_TOKEN
        sync: false
      - key: GIST_ID
        sync: false
